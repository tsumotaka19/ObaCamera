name: Build ObaCamera APK v1.3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ========================================
      # 1. 元プロジェクト取得
      # ========================================

      - name: Create project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/obacamera

          curl -fsSL \
            "https://raw.githubusercontent.com/tsumotaka19/ObaCamera/781a8a3/.github/workflows/build.yml" \
            -o /tmp/source.yml

          python3 - <<'PY'
          import re
          import base64
          from pathlib import Path

          source = Path("/tmp/source.yml").read_text()

          match = re.search(
              r"echo '([A-Za-z0-9+/=\s]+)'\s*\|\s*base64\s+-d",
              source,
              re.DOTALL
          )

          if not match:
              raise RuntimeError(
                  "Embedded project ZIP was not found"
              )

          encoded = re.sub(
              r"\s+",
              "",
              match.group(1)
          )

          data = base64.b64decode(encoded)

          if not data.startswith(b"PK"):
              raise RuntimeError(
                  "Decoded project is not a ZIP"
              )

          Path(
              "/tmp/obacamera/project.zip"
          ).write_bytes(data)

          print(
              "PROJECT ZIP:",
              len(data),
              "bytes"
          )
          PY

          test -s /tmp/obacamera/project.zip

          cd /tmp/obacamera

          unzip -q project.zip

          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

          echo "=== PROJECT CREATED ==="


      # ========================================
      # 2. Java
      # ========================================

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ========================================
      # 3. Android SDK
      # ========================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4


      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "=== ANDROID SDK READY ==="


      # ========================================
      # 4. Gradle
      # ========================================

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'


      # ========================================
      # 5. Configure project
      # ========================================

      - name: Configure project
        working-directory: /tmp/obacamera
        shell: bash
        run: |
          set -euo pipefail

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  org.gradle.api.initialization.resolve.RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "ObaCamera"

          include(":app")
          EOF


          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF


          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.obacamera'

              compileSdk 35

              defaultConfig {
                  applicationId 'com.example.obacamera'

                  minSdk 26

                  targetSdk 35

                  versionCode 4

                  versionName "1.3"
              }
          }

          dependencies {
              def camerax_version = "1.5.3"

              implementation "androidx.camera:camera-core:${camerax_version}"

              implementation "androidx.camera:camera-camera2:${camerax_version}"

              implementation "androidx.camera:camera-lifecycle:${camerax_version}"

              implementation "androidx.camera:camera-view:${camerax_version}"

              implementation "androidx.activity:activity:1.10.1"
          }
          EOF

          echo "=== PROJECT CONFIGURED ==="


      # ========================================
      # 6. MainActivity
      # ========================================

      - name: Configure camera implementation
        working-directory: /tmp/obacamera
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            app/src/main/java/com/example/obacamera

          cat > app/src/main/java/com/example/obacamera/MainActivity.java <<'JAVA_EOF'
          package com.example.obacamera;

          import android.Manifest;
          import android.content.Context;
          import android.content.ContentValues;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.graphics.Rect;
          import android.media.SoundPool;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.MediaStore;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.FrameLayout;
          import android.widget.Toast;
          import android.util.SparseBooleanArray;

          import androidx.activity.ComponentActivity;
          import androidx.annotation.NonNull;
          import androidx.camera.core.CameraSelector;
          import androidx.camera.core.ImageCapture;
          import androidx.camera.core.ImageCaptureException;
          import androidx.camera.core.Preview;
          import androidx.camera.lifecycle.ProcessCameraProvider;
          import androidx.camera.view.PreviewView;
          import androidx.core.content.ContextCompat;

          import com.google.common.util.concurrent.ListenableFuture;


          public class MainActivity extends ComponentActivity {

              private static final int REQ_CAMERA = 10;

              private static final String VERSION_NAME = "1.3";

              private static final int VERSION_CODE = 4;

              private PreviewView previewView;

              private Button shutter;

              private View flashView;

              private ImageCapture imageCapture;

              private ProcessCameraProvider cameraProvider;

              private SoundPool soundPool;

              private int shutterSoundId;

              private boolean soundReady = false;

              private boolean cameraReady = false;

              private final SparseBooleanArray pointerInsideButton =
                      new SparseBooleanArray();

              private final Handler flashHandler =
                      new Handler(Looper.getMainLooper());


              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().setStatusBarColor(Color.BLACK);

                  getWindow().setNavigationBarColor(Color.BLACK);

                  getWindow().addFlags(
                          WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON
                  );


                  TouchFrameLayout root =
                          new TouchFrameLayout(this);

                  root.setBackgroundColor(Color.BLACK);


                  previewView =
                          new PreviewView(this);

                  previewView.setImplementationMode(
                          PreviewView.ImplementationMode.PERFORMANCE
                  );

                  previewView.setScaleType(
                          PreviewView.ScaleType.FILL_CENTER
                  );


                  root.addView(
                          previewView,
                          new FrameLayout.LayoutParams(
                                  -1,
                                  -1
                          )
                  );


                  int screenWidth =
                          getResources()
                                  .getDisplayMetrics()
                                  .widthPixels;

                  int shutterWidth =
                          (int)(screenWidth * 0.60f);


                  shutter =
                          new Button(this);

                  shutter.setText("写真を撮る");

                  shutter.setTextSize(22);

                  shutter.setTextColor(Color.BLACK);

                  shutter.setAllCaps(false);

                  shutter.setBackgroundColor(Color.WHITE);

                  shutter.setEnabled(false);

                  shutter.setClickable(false);

                  shutter.setFocusable(false);


                  FrameLayout.LayoutParams shutterParams =
                          new FrameLayout.LayoutParams(
                                  shutterWidth,
                                  dp(92),
                                  Gravity.BOTTOM |
                                          Gravity.CENTER_HORIZONTAL
                          );

                  shutterParams.setMargins(
                          0,
                          dp(24),
                          0,
                          dp(24)
                  );


                  root.addView(
                          shutter,
                          shutterParams
                  );


                  flashView =
                          new View(this);

                  flashView.setBackgroundColor(Color.BLACK);

                  flashView.setVisibility(View.GONE);

                  flashView.setClickable(false);

                  flashView.setFocusable(false);


                  root.addView(
                          flashView,
                          new FrameLayout.LayoutParams(
                                  -1,
                                  -1
                          )
                  );


                  setContentView(root);


                  initializeShutterSound();


                  if (
                          checkSelfPermission(
                                  Manifest.permission.CAMERA
                          ) != PackageManager.PERMISSION_GRANTED
                  ) {

                      requestPermissions(
                              new String[]{
                                      Manifest.permission.CAMERA
                              },
                              REQ_CAMERA
                      );

                  } else {

                      startCamera();
                  }
              }


              private int dp(int value) {

                  return (int)(
                          value *
                                  getResources()
                                          .getDisplayMetrics()
                                          .density
                                  + 0.5f
                  );
              }


              private void initializeShutterSound() {

                  soundPool =
                          new SoundPool.Builder()
                                  .setMaxStreams(8)
                                  .build();


                  soundPool.setOnLoadCompleteListener(
                          (pool, sampleId, status) -> {

                              if (
                                      status == 0 &&
                                      sampleId == shutterSoundId
                              ) {

                                  soundReady = true;

                                  updateShutterState();
                              }
                          }
                  );


                  shutterSoundId =
                          soundPool.load(
                                  this,
                                  R.raw.shutter,
                                  1
                          );
              }


              private void updateShutterState() {

                  shutter.setEnabled(
                          cameraReady &&
                                  soundReady
                  );
              }


              private void startCamera() {

                  cameraReady = false;

                  updateShutterState();


                  ListenableFuture<ProcessCameraProvider> future =
                          ProcessCameraProvider.getInstance(this);


                  future.addListener(
                          () -> {

                              try {

                                  cameraProvider =
                                          future.get();


                                  cameraProvider.unbindAll();


                                  Preview preview =
                                          new Preview.Builder()
                                                  .build();


                                  preview.setSurfaceProvider(
                                          previewView
                                                  .getSurfaceProvider()
                                  );


                                  imageCapture =
                                          new ImageCapture.Builder()
                                                  .setCaptureMode(
                                                          ImageCapture
                                                                  .CAPTURE_MODE_MINIMIZE_LATENCY
                                                  )
                                                  .setTargetRotation(
                                                          previewView
                                                                  .getDisplay()
                                                                  .getRotation()
                                                  )
                                                  .build();


                                  CameraSelector selector =
                                          CameraSelector.DEFAULT_BACK_CAMERA;


                                  cameraProvider.bindToLifecycle(
                                          this,
                                          selector,
                                          preview,
                                          imageCapture
                                  );


                                  cameraReady = true;

                                  updateShutterState();


                              } catch (Exception e) {

                                  cameraReady = false;

                                  updateShutterState();


                                  Toast.makeText(
                                          this,
                                          "カメラを開始できませんでした",
                                          Toast.LENGTH_SHORT
                                  ).show();
                              }

                          },
                          ContextCompat.getMainExecutor(this)
                  );
              }


              private void showCaptureFlash() {

                  if (flashView == null) {
                      return;
                  }


                  flashHandler.removeCallbacksAndMessages(null);


                  flashView.setVisibility(
                          View.VISIBLE
                  );


                  flashHandler.postDelayed(
                          () -> {

                              if (flashView != null) {

                                  flashView.setVisibility(
                                          View.GONE
                                  );
                              }

                          },
                          100
                  );
              }


              private void takePhoto() {

                  if (
                          imageCapture == null ||
                          !cameraReady ||
                          !soundReady
                  ) {

                      return;
                  }


                  showCaptureFlash();


                  long now =
                          System.currentTimeMillis();


                  ContentValues values =
                          new ContentValues();


                  values.put(
                          MediaStore.Images.Media.DISPLAY_NAME,
                          "IMG_" + now + ".jpg"
                  );


                  values.put(
                          MediaStore.Images.Media.MIME_TYPE,
                          "image/jpeg"
                  );


                  if (
                          Build.VERSION.SDK_INT >=
                                  Build.VERSION_CODES.Q
                  ) {

                      values.put(
                              MediaStore.Images.Media.RELATIVE_PATH,
                              Environment.DIRECTORY_DCIM +
                                      "/Camera"
                      );

                      values.put(
                              MediaStore.Images.Media.IS_PENDING,
                              1
                      );
                  }


                  ImageCapture.OutputFileOptions outputOptions =
                          new ImageCapture.OutputFileOptions.Builder(
                                  getContentResolver(),
                                  MediaStore.Images.Media.EXTERNAL_CONTENT_URI,
                                  values
                          ).build();


                  soundPool.play(
                          shutterSoundId,
                          0.7f,
                          0.7f,
                          1,
                          0,
                          1.0f
                  );


                  imageCapture.takePicture(
                          outputOptions,
                          ContextCompat.getMainExecutor(this),

                          new ImageCapture.OnImageSavedCallback() {

                              @Override
                              public void onImageSaved(
                                      @NonNull
                                      ImageCapture.OutputFileResults result
                              ) {

                                  if (
                                          Build.VERSION.SDK_INT >=
                                                  Build.VERSION_CODES.Q &&
                                          result.getSavedUri() != null
                                  ) {

                                      ContentValues publish =
                                              new ContentValues();

                                      publish.put(
                                              MediaStore.Images.Media.IS_PENDING,
                                              0
                                      );

                                      getContentResolver().update(
                                              result.getSavedUri(),
                                              publish,
                                              null,
                                              null
                                      );
                                  }
                              }


                              @Override
                              public void onError(
                                      @NonNull
                                      ImageCaptureException exception
                              ) {

                                  Toast.makeText(
                                          MainActivity.this,
                                          "撮影に失敗しました",
                                          Toast.LENGTH_SHORT
                                  ).show();
                              }
                          }
                  );
              }


              private void inspectTouchEvent(
                      MotionEvent event
              ) {

                  if (shutter == null) {
                      return;
                  }


                  Rect buttonRect =
                          new Rect();

                  shutter.getHitRect(
                          buttonRect
                  );


                  int action =
                          event.getActionMasked();


                  int actionIndex =
                          event.getActionIndex();


                  if (
                          action == MotionEvent.ACTION_DOWN
                  ) {

                      int pointerId =
                              event.getPointerId(0);

                      float x =
                              event.getX(0);

                      float y =
                              event.getY(0);

                      boolean inside =
                              buttonRect.contains(
                                      (int)x,
                                      (int)y
                              );

                      pointerInsideButton.put(
                              pointerId,
                              inside
                      );


                      if (inside) {
                          takePhoto();
                      }


                      return;
                  }


                  if (
                          action ==
                                  MotionEvent.ACTION_POINTER_DOWN
                  ) {

                      int pointerId =
                              event.getPointerId(
                                      actionIndex
                              );

                      float x =
                              event.getX(
                                      actionIndex
                              );

                      float y =
                              event.getY(
                                      actionIndex
                              );

                      boolean inside =
                              buttonRect.contains(
                                      (int)x,
                                      (int)y
                              );

                      pointerInsideButton.put(
                              pointerId,
                              inside
                      );


                      if (inside) {
                          takePhoto();
                      }


                      return;
                  }


                  if (
                          action == MotionEvent.ACTION_MOVE
                  ) {

                      int pointerCount =
                              event.getPointerCount();


                      for (
                              int i = 0;
                              i < pointerCount;
                              i++
                      ) {

                          int pointerId =
                                  event.getPointerId(i);

                          float x =
                                  event.getX(i);

                          float y =
                                  event.getY(i);

                          boolean inside =
                                  buttonRect.contains(
                                          (int)x,
                                          (int)y
                                  );

                          boolean wasInside =
                                  pointerInsideButton.get(
                                          pointerId,
                                          false
                                  );


                          if (
                                  inside &&
                                  !wasInside
                          ) {

                              takePhoto();
                          }


                          pointerInsideButton.put(
                                  pointerId,
                                  inside
                          );
                      }


                      return;
                  }


                  if (
                          action ==
                                  MotionEvent.ACTION_POINTER_UP
                  ) {

                      int pointerId =
                              event.getPointerId(
                                      actionIndex
                              );

                      pointerInsideButton.delete(
                              pointerId
                      );

                      return;
                  }


                  if (
                          action == MotionEvent.ACTION_UP ||
                          action == MotionEvent.ACTION_CANCEL
                  ) {

                      pointerInsideButton.clear();
                  }
              }


              private class TouchFrameLayout
                      extends FrameLayout {

                  TouchFrameLayout(Context context) {

                      super(context);

                      setClickable(true);

                      setFocusable(true);
                  }


                  @Override
                  public boolean dispatchTouchEvent(
                          MotionEvent event
                  ) {

                      inspectTouchEvent(event);

                      return true;
                  }
              }


              @Override
              public void onRequestPermissionsResult(
                      int requestCode,
                      @NonNull String[] permissions,
                      @NonNull int[] grantResults
              ) {

                  super.onRequestPermissionsResult(
                          requestCode,
                          permissions,
                          grantResults
                  );


                  if (
                          requestCode == REQ_CAMERA &&
                          grantResults.length > 0 &&
                          grantResults[0] ==
                                  PackageManager.PERMISSION_GRANTED
                  ) {

                      startCamera();

                  } else if (
                          requestCode == REQ_CAMERA
                  ) {

                      Toast.makeText(
                              this,
                              "カメラの権限が必要です",
                              Toast.LENGTH_SHORT
                      ).show();
                  }
              }


              @Override
              protected void onDestroy() {

                  flashHandler.removeCallbacksAndMessages(null);


                  if (cameraProvider != null) {

                      cameraProvider.unbindAll();
                  }


                  if (soundPool != null) {

                      soundPool.release();

                      soundPool = null;
                  }


                  super.onDestroy();
              }
          }
          JAVA_EOF

          test -s \
            app/src/main/java/com/example/obacamera/MainActivity.java

          echo "=== MAIN ACTIVITY CREATED ==="


      # ========================================
      # 7. シャッター音
      # ========================================

      - name: Create shutter sound
        working-directory: /tmp/obacamera
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/res/raw

          python3 - <<'PY'
          import math
          import random
          import struct
          import wave
          from pathlib import Path

          sample_rate = 16000

          duration = 0.085

          count = int(
              sample_rate * duration
          )

          rng = random.Random(7319)

          samples = []

          lp = 0.0

          for i in range(count):

              t = i / sample_rate

              u = t

              envelope = math.exp(
                  -u / 0.010
              )

              attack = min(
                  1.0,
                  u / 0.00045
              )

              envelope *= attack

              noise = rng.uniform(
                  -1.0,
                  1.0
              )

              lp += 0.16 * (
                  noise - lp
              )

              high = noise - lp

              tone1 = math.sin(
                  2.0 *
                  math.pi *
                  1900.0 *
                  u
              )

              tone2 = math.sin(
                  2.0 *
                  math.pi *
                  3150.0 *
                  u
              )

              value = envelope * (
                  0.70 * high +
                  0.16 * tone1 +
                  0.07 * tone2
              )

              samples.append(
                  value
              )


          peak = max(
              abs(x)
              for x in samples
          )

          if peak == 0:
              peak = 1.0


          normalized = [
              max(
                  -1.0,
                  min(
                      1.0,
                      x / peak
                  )
              )
              for x in samples
          ]


          output = Path(
              "app/src/main/res/raw/shutter.wav"
          )


          with wave.open(
              str(output),
              "wb"
          ) as wav:

              wav.setnchannels(1)

              wav.setsampwidth(2)

              wav.setframerate(sample_rate)

              for value in normalized:

                  wav.writeframes(
                      struct.pack(
                          "<h",
                          int(
                              value *
                              32767
                          )
                      )
                  )


          with wave.open(
              str(output),
              "rb"
          ) as wav:

              assert wav.getnchannels() == 1

              assert wav.getsampwidth() == 2

              assert wav.getframerate() == 16000


          print(
              "SHUTTER SOUND CREATED"
          )

          print(
              "SIZE:",
              output.stat().st_size,
              "bytes"
          )

          print(
              "DURATION:",
              duration,
              "seconds"
          )
          PY

          test -s \
            app/src/main/res/raw/shutter.wav

          echo "=== SHUTTER SOUND OK ==="


      # ========================================
      # 8. アイコン
      # ========================================

      - name: Install launcher icon
        working-directory: /tmp/obacamera
        shell: bash
        run: |
          set -euo pipefail

          RES="app/src/main/res"

          MANIFEST="app/src/main/AndroidManifest.xml"


          rm -rf \
            "$RES/mipmap" \
            "$RES/mipmap-mdpi" \
            "$RES/mipmap-hdpi" \
            "$RES/mipmap-xhdpi" \
            "$RES/mipmap-xxhdpi" \
            "$RES/mipmap-xxxhdpi" \
            "$RES/mipmap-anydpi" \
            "$RES/mipmap-anydpi-v26" \
            "$RES/mipmap-nodpi"


          mkdir -p \
            "$RES/mipmap-nodpi"


          curl -fsSL \
            "https://raw.githubusercontent.com/tsumotaka19/ObaCamera/main/icon.png?run=${GITHUB_RUN_ID}" \
            -o \
            "$RES/mipmap-nodpi/ic_launcher.png"


          test -s \
            "$RES/mipmap-nodpi/ic_launcher.png"


          python3 - <<'PY'
          from pathlib import Path
          import re

          icon = Path(
              "app/src/main/res/mipmap-nodpi/ic_launcher.png"
          )

          if not icon.read_bytes().startswith(
              b"\x89PNG\r\n\x1a\n"
          ):
              raise RuntimeError(
                  "Icon is not PNG"
              )


          manifest = Path(
              "app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text()


          text = re.sub(
              r'\s+android:icon\s*=\s*"[^"]*"',
              '',
              text
          )


          text = re.sub(
              r'\s+android:roundIcon\s*=\s*"[^"]*"',
              '',
              text
          )


          text = text.replace(
              "<application",
              '<application '
              'android:icon="@mipmap/ic_launcher" '
              'android:roundIcon="@mipmap/ic_launcher"',
              1
          )


          manifest.write_text(text)

          print("ICON OK")

          print("MANIFEST OK")
          PY


      # ========================================
      # 9. Build
      # ========================================

      - name: Build APK
        working-directory: /tmp/obacamera
        shell: bash
        run: |
          set -euo pipefail

          echo "=== VERSION 1.3 BUILD 4 ==="

          echo "=== JAVA ==="

          java -version

          echo "=== GRADLE ==="

          gradle --version


          echo "=== GRADLE CONFIGURATION CHECK ==="

          gradle tasks --no-daemon


          echo "=== BUILD ==="

          gradle \
            clean \
            assembleDebug \
            --no-daemon


          APK="app/build/outputs/apk/debug/app-debug.apk"


          test -s "$APK"


          mkdir -p \
            /tmp/obacamera/final


          cp \
            "$APK" \
            "/tmp/obacamera/final/ObaCamera-v1.3-build4.apk"


          test -s \
            "/tmp/obacamera/final/ObaCamera-v1.3-build4.apk"


          echo "=== APK BUILD SUCCESS ==="

          ls -lh \
            "/tmp/obacamera/final/ObaCamera-v1.3-build4.apk"


      # ========================================
      # 10. APK検証
      # ========================================

      - name: Verify APK
        working-directory: /tmp/obacamera
        shell: bash
        run: |
          set -euo pipefail

          APK="/tmp/obacamera/final/ObaCamera-v1.3-build4.apk"

          AAPT2="$ANDROID_HOME/build-tools/35.0.0/aapt2"


          test -s "$APK"


          echo "=== APK BADGING ==="

          "$AAPT2" dump badging "$APK"


          echo "=== VERSION CHECK ==="

          "$AAPT2" dump badging "$APK" | grep \
            "versionCode='4' versionName='1.3'"


          echo "=== LAUNCHER CHECK ==="

          "$AAPT2" dump badging "$APK" | grep \
            "launchable-activity"


          echo "=== SHUTTER SOUND CHECK ==="

          "$AAPT2" dump resources "$APK" | grep \
            "shutter"


          echo "=== APK SIZE ==="

          ls -lh "$APK"


          echo "=== FINAL VERIFICATION SUCCESS ==="


      # ========================================
      # 11. Artifact
      # ========================================

