name: Build ObaCamera APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ========================================
      # 1. 元プロジェクトを取得
      # ========================================
      - name: Create project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/obacamera

          curl -fsSL \
            "https://raw.githubusercontent.com/tsumotaka19/ObaCamera/781a8a3/.github/workflows/build.yml" \
            -o /tmp/source.yml

          python3 - <<'PY'
          import re
          import base64
          from pathlib import Path

          source = Path("/tmp/source.yml").read_text()

          match = re.search(
              r"echo '([A-Za-z0-9+/=\s]+)'\s*\|\s*base64\s+-d",
              source,
              re.DOTALL
          )

          if not match:
              raise RuntimeError("Embedded project ZIP was not found")

          encoded = re.sub(r"\s+", "", match.group(1))
          data = base64.b64decode(encoded)

          if not data.startswith(b"PK"):
              raise RuntimeError("Decoded data is not a ZIP file")

          Path("/tmp/obacamera/project.zip").write_bytes(data)

          print("PROJECT ZIP:", len(data), "bytes")
          PY

          test -s /tmp/obacamera/project.zip

          cd /tmp/obacamera
          unzip -q project.zip

          test -f app/build.gradle
          test -f app/src/main/java/com/example/obacamera/MainActivity.java
          test -f app/src/main/AndroidManifest.xml

          echo "=== PROJECT CREATED ==="


      # ========================================
      # 2. ビルド環境
      # ========================================
      - name: Configure build environment
        shell: bash
        run: |
          set -euo pipefail

          cd /tmp/obacamera

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  org.gradle.api.initialization.resolve.RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "ObaCamera"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          echo "=== BUILD ENVIRONMENT CONFIGURED ==="


      # ========================================
      # 3. CameraX + シャッター音 + MediaStore
      # ========================================
      - name: Configure camera implementation
        shell: bash
        run: |
          set -euo pipefail

          RES="/tmp/obacamera/app/src/main/res"
          mkdir -p "$RES/raw"


          # ========================================
          # コンパクト版シャッター音をビルド時生成
          # 承認済みv3の「1回目だけ」の構造を小さく再現
          # ========================================
          python3 - <<'PY'
          import math
          import random
          import struct
          import wave
          from pathlib import Path

          sr = 16000
          duration = 0.085
          n = int(sr * duration)
          rng = random.Random(7319)

          lp1 = 0.0
          lp2 = 0.0
          samples = []

          events = [
              (0.000, 0.72, 0.006),
              (0.030, 0.58, 0.010),
              (0.064, 0.48, 0.011),
          ]

          for i in range(n):
              t = i / sr
              value = 0.0

              for onset, amp, tau in events:
                  u = t - onset

                  if u < 0.0:
                      continue

                  env = math.exp(-u / tau)
                  env *= min(1.0, u / 0.0006)

                  r = rng.uniform(-1.0, 1.0)
                  lp1 += 0.18 * (r - lp1)
                  hp = r - lp1

                  r2 = rng.uniform(-1.0, 1.0)
                  lp2 += 0.055 * (r2 - lp2)

                  texture = (
                      0.62 * hp
                      + 0.20 * lp2
                      + 0.10 * math.sin(
                          2.0 * math.pi * 1850.0 * u
                      )
                      + 0.05 * math.sin(
                          2.0 * math.pi * 3100.0 * u
                      )
                  )

                  value += amp * texture * env

              if t >= 0.017:
                  u = t - 0.017

                  value += (
                      0.055
                      * rng.uniform(-1.0, 1.0)
                      * math.exp(-u / 0.018)
                  )

              samples.append(value)

          peak = max(abs(x) for x in samples) or 1.0

          samples = [
              max(-1.0, min(1.0, x / peak * 0.70))
              for x in samples
          ]

          output = Path(
              "/tmp/obacamera/app/src/main/res/raw/shutter.wav"
          )

          with wave.open(str(output), "wb") as wav:
              wav.setnchannels(1)
              wav.setsampwidth(2)
              wav.setframerate(sr)

              for value in samples:
                  wav.writeframes(
                      struct.pack(
                          "<h",
                          int(value * 32767)
                      )
                  )

          print("SHUTTER SOUND GENERATED")
          print("SAMPLE RATE:", sr)
          print("DURATION:", duration)
          print("PEAK: 0.70")
          PY


          test -s "$RES/raw/shutter.wav"


          python3 - <<'PY'
          import wave
          from pathlib import Path

          p = Path(
              "/tmp/obacamera/app/src/main/res/raw/shutter.wav"
          )

          with wave.open(str(p), "rb") as w:

              if w.getframerate() != 16000:
                  raise RuntimeError("Unexpected sample rate")

              if w.getnchannels() != 1:
                  raise RuntimeError("Unexpected channel count")

              if w.getsampwidth() != 2:
                  raise RuntimeError("Unexpected sample width")

              print("SHUTTER WAV: OK")
              print("BYTES:", p.stat().st_size)
              print("CHANNELS:", w.getnchannels())
              print("SAMPLE WIDTH:", w.getsampwidth())
              print("SAMPLE RATE:", w.getframerate())
              print("FRAMES:", w.getnframes())
              print("DURATION:", w.getnframes() / w.getframerate())
          PY


          # ========================================
          # app/build.gradle
          # ========================================
          cat > /tmp/obacamera/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.obacamera'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.example.obacamera'
                  minSdk 26
                  targetSdk 35
                  versionCode 2
                  versionName '1.1'
              }
          }

          dependencies {
              def camerax_version = "1.5.3"

              implementation "androidx.camera:camera-core:${camerax_version}"
              implementation "androidx.camera:camera-camera2:${camerax_version}"
              implementation "androidx.camera:camera-lifecycle:${camerax_version}"
              implementation "androidx.camera:camera-view:${camerax_version}"

              implementation "androidx.activity:activity:1.10.1"
          }
          EOF


          # ========================================
          # MainActivity.java
          # ========================================
          cat > /tmp/obacamera/app/src/main/java/com/example/obacamera/MainActivity.java <<'EOF'
          package com.example.obacamera;

          import android.Manifest;
          import android.content.ContentValues;
          import android.content.pm.PackageManager;
          import android.media.SoundPool;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.view.Gravity;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.FrameLayout;
          import android.widget.Toast;

          import androidx.activity.ComponentActivity;
          import androidx.annotation.NonNull;
          import androidx.camera.core.CameraSelector;
          import androidx.camera.core.ImageCapture;
          import androidx.camera.core.ImageCaptureException;
          import androidx.camera.core.Preview;
          import androidx.camera.lifecycle.ProcessCameraProvider;
          import androidx.camera.view.PreviewView;
          import androidx.core.content.ContextCompat;

          import com.google.common.util.concurrent.ListenableFuture;


          public class MainActivity extends ComponentActivity {

              private static final int REQ_CAMERA = 10;

              private PreviewView previewView;
