name: Build ObaCamera APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create project from fixed source
        shell: bash
        run: |
          set -e

          mkdir -p /tmp/obacamera

          curl -fsSL \
            "https://raw.githubusercontent.com/tsumotaka19/ObaCamera/781a8a3/.github/workflows/build.yml" \
            -o /tmp/source.yml

          sed -n "s/.*echo '\([^']*\)' | base64 -d.*/\1/p" \
            /tmp/source.yml \
            | base64 -d > /tmp/obacamera/project.zip

          test -s /tmp/obacamera/project.zip

          cd /tmp/obacamera
          unzip -q project.zip

          echo "=== PROJECT CREATED ==="
          find app/src/main -maxdepth 4 -type f | sort

      - name: Install custom launcher icon
        shell: bash
        run: |
          set -e

          RES="/tmp/obacamera/app/src/main/res"
          MANIFEST="/tmp/obacamera/app/src/main/AndroidManifest.xml"

          # 既存のlauncher iconを完全削除
          rm -rf \
            "$RES/mipmap" \
            "$RES/mipmap-mdpi" \
            "$RES/mipmap-hdpi" \
            "$RES/mipmap-xhdpi" \
            "$RES/mipmap-xxhdpi" \
            "$RES/mipmap-xxxhdpi" \
            "$RES/mipmap-anydpi" \
            "$RES/mipmap-anydpi-v26" \
            "$RES/mipmap-nodpi"

          # 新しいlauncher icon専用ディレクトリ
          mkdir -p "$RES/mipmap-nodpi"

          # GitHub上の本物のicon.pngを取得
          curl -fsSL \
            "https://raw.githubusercontent.com/tsumotaka19/ObaCamera/main/icon.png?cachebust=${GITHUB_RUN_ID}" \
            -o "$RES/mipmap-nodpi/ic_launcher.png"

          # ファイル取得確認
          test -s "$RES/mipmap-nodpi/ic_launcher.png"

          echo "=== ICON FILE ==="
          ls -lh "$RES/mipmap-nodpi/ic_launcher.png"
          file "$RES/mipmap-nodpi/ic_launcher.png"

          # Manifestを書き換える
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("/tmp/obacamera/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          # applicationのicon / roundIconを削除
          s = re.sub(
              r'\s+android:icon\s*=\s*"[^"]*"',
              '',
              s
          )

          s = re.sub(
              r'\s+android:roundIcon\s*=\s*"[^"]*"',
              '',
              s
          )

          # applicationタグへ確実に追加
          s = s.replace(
              '<application',
              '<application android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher"',
              1
          )

          p.write_text(s)
          PY

          # Manifest確認
          grep -q 'android:icon="@mipmap/ic_launcher"' "$MANIFEST"
          grep -q 'android:roundIcon="@mipmap/ic_launcher"' "$MANIFEST"

          echo "=== MANIFEST ICON ==="
          grep '<application' "$MANIFEST"

          # launcher iconが他に残っていないことを確認
          echo "=== OLD ICON SEARCH ==="
          find "$RES" -type f \
            \( -name 'ic_launcher*' -o -name 'ic_launcher_round*' \) \
            -print

          echo "=== ICON INSTALL: OK ==="

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build APK
        working-directory: /tmp/obacamera
        run: |
          set -e
          gradle clean assembleDebug

      - name: Verify APK icon
        shell: bash
        run: |
          set -e

          APK="/tmp/obacamera/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"

          test -s "$APK"

          echo "========================================"
          echo " APK SIZE"
          echo "========================================"
          ls -lh "$APK"

          echo "========================================"
          echo " ICON FILE INSIDE APK"
          echo "========================================"

          unzip -l "$APK" \
            | grep 'mipmap-nodpi/ic_launcher.png'

          echo "========================================"
          echo " MANIFEST APPLICATION ICON"
          echo "========================================"

          "$AAPT" dump badging "$APK" \
            | grep 'application-icon'

          echo "========================================"
          echo " APK RESOURCE CHECK"
          echo "========================================"

          "$AAPT" dump resources "$APK" \
            | grep -E 'mipmap-nodpi/ic_launcher|mipmap/ic_launcher'

          echo "========================================"
          echo " ICON VERIFICATION SUCCESS"
          echo "========================================"

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: ObaCamera-FINAL-ICON
          path: /tmp/obacamera/app/build/outputs/apk/debug/app-debug.apk
