name: Build ObaCamera APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ========================================
      # 1. 元プロジェクトを確実に展開
      # ========================================
      - name: Create project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/obacamera

          curl -fsSL \
            "https://raw.githubusercontent.com/tsumotaka19/ObaCamera/781a8a3/.github/workflows/build.yml" \
            -o /tmp/source.yml

          python3 - <<'PY'
          import re
          import base64
          from pathlib import Path

          source = Path("/tmp/source.yml").read_text()

          match = re.search(
              r"echo '([A-Za-z0-9+/=\s]+)'\s*\|\s*base64\s+-d",
              source,
              re.DOTALL
          )

          if not match:
              raise RuntimeError(
                  "ERROR: embedded project ZIP was not found"
              )

          encoded = re.sub(r"\s+", "", match.group(1))
          data = base64.b64decode(encoded)

          if not data.startswith(b"PK"):
              raise RuntimeError(
                  "ERROR: decoded data is not a ZIP file"
              )

          Path("/tmp/obacamera/project.zip").write_bytes(data)

          print("=== PROJECT ZIP FOUND ===")
          print(f"ZIP size: {len(data)} bytes")
          PY

          test -s /tmp/obacamera/project.zip

          cd /tmp/obacamera
          unzip -q project.zip

          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

          echo "=== PROJECT CREATED SUCCESSFULLY ==="
          find app/src/main -maxdepth 5 -type f | sort

      # ========================================
      # 2. 最終アイコンを取得
      # ========================================
      - name: Install final launcher icon
        shell: bash
        run: |
          set -euo pipefail

          RES="/tmp/obacamera/app/src/main/res"
          MANIFEST="/tmp/obacamera/app/src/main/AndroidManifest.xml"
          ICON="$RES/mipmap-nodpi/ic_launcher.png"

          # 既存launcher iconを完全削除
          rm -rf \
            "$RES/mipmap" \
            "$RES/mipmap-mdpi" \
            "$RES/mipmap-hdpi" \
            "$RES/mipmap-xhdpi" \
            "$RES/mipmap-xxhdpi" \
            "$RES/mipmap-xxxhdpi" \
            "$RES/mipmap-anydpi" \
            "$RES/mipmap-anydpi-v26" \
            "$RES/mipmap-nodpi"

          mkdir -p "$RES/mipmap-nodpi"

          # GitHub上の現在のicon.pngを取得
          curl -fsSL \
            "https://raw.githubusercontent.com/tsumotaka19/ObaCamera/main/icon.png?run=${GITHUB_RUN_ID}" \
            -o "$ICON"

          test -s "$ICON"

          echo "=== FINAL ICON ==="
          ls -lh "$ICON"
          file "$ICON"

          # PNGであることを確認
          python3 - <<'PY'
          from pathlib import Path

          p = Path("/tmp/obacamera/app/src/main/res/mipmap-nodpi/ic_launcher.png")
          data = p.read_bytes()

          png_signature = b"\x89PNG\r\n\x1a\n"

          if not data.startswith(png_signature):
              raise RuntimeError("ERROR: downloaded icon is not a PNG")

          print("PNG validation: OK")
          print(f"Icon bytes: {len(data)}")
          PY

          # ========================================
          # Manifestのicon指定を完全に置換
          # ========================================
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("/tmp/obacamera/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          # 既存のicon指定を削除
          s = re.sub(
              r'\s+android:icon\s*=\s*"[^"]*"',
              '',
              s
          )

          s = re.sub(
              r'\s+android:roundIcon\s*=\s*"[^"]*"',
              '',
              s
          )

          # applicationタグに最終アイコンを指定
          replacement = (
              '<application '
              'android:icon="@mipmap/ic_launcher" '
              'android:roundIcon="@mipmap/ic_launcher"'
          )

          s = s.replace(
              '<application',
              replacement,
              1
          )

          p.write_text(s)
          PY

          # Manifest確認
          grep -q \
            'android:icon="@mipmap/ic_launcher"' \
            "$MANIFEST"

          grep -q \
            'android:roundIcon="@mipmap/ic_launcher"' \
            "$MANIFEST"

          echo "=== MANIFEST ==="
          grep '<application' "$MANIFEST"

          echo "=== ICON FILE ==="
          ls -lh "$ICON"

          echo "=== ICON INSTALL SUCCESS ==="

      # ========================================
      # 3. Java
      # ========================================
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ========================================
      # 4. Android SDK
      # ========================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ========================================
      # 5. Gradle
      # ========================================
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      # ========================================
      # 6. APK Build
      # ========================================
      - name: Build APK
        working-directory: /tmp/obacamera
        shell: bash
        run: |
          set -euo pipefail

          gradle clean assembleDebug

          test -s \
            app/build/outputs/apk/debug/app-debug.apk

          echo "=== APK BUILD SUCCESS ==="
          ls -lh \
            app/build/outputs/apk/debug/app-debug.apk

      # ========================================
      # 7. APK内部のアイコンを検査
      # ========================================
      - name: Verify final icon inside APK
        shell: bash
        run: |
          set -euo pipefail

          APK="/tmp/obacamera/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"

          test -s "$APK"

          echo "========================================"
          echo "APK SIZE"
          echo "========================================"
          ls -lh "$APK"

          echo "========================================"
          echo "ICON INSIDE APK"
          echo "========================================"

          unzip -l "$APK" \
            | grep -E \
              'mipmap-nodpi/ic_launcher\.png'

          echo "========================================"
          echo "MANIFEST ICON"
          echo "========================================"

          "$AAPT" dump badging "$APK" \
            | grep 'application-icon'

          echo "========================================"
          echo "RESOURCE CHECK"
          echo "========================================"

          "$AAPT" dump resources "$APK" \
            | grep -E \
              'mipmap-nodpi/ic_launcher|mipmap/ic_launcher'

          echo "========================================"
          echo "FINAL ICON VERIFICATION: SUCCESS"
          echo "========================================"

      # ========================================
      # 8. 最終APKをArtifactとして保存
      # ========================================
      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: ObaCamera-FINAL-ICON
          path: /tmp/obacamera/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
