name: Build ObaCamera APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create project from fixed source
        shell: bash
        run: |
          set -e

          mkdir -p /tmp/obacamera

          # 元プロジェクトを固定コミットから取得
          curl -fsSL \
            "https://raw.githubusercontent.com/tsumotaka19/ObaCamera/781a8a3/.github/workflows/build.yml" \
            -o /tmp/source.yml

          # 元workflow内のembedded project.zipを取り出す
          sed -n "s/.*echo '\([^']*\)' | base64 -d.*/\1/p" \
            /tmp/source.yml \
            | base64 -d > /tmp/obacamera/project.zip

          test -s /tmp/obacamera/project.zip

          cd /tmp/obacamera
          unzip -q project.zip

      - name: Install custom icon
        shell: bash
        run: |
          set -e

          mkdir -p /tmp/obacamera/app/src/main/res/drawable-nodpi

          # GitHubに置いたアイコンを取得
          curl -fsSL \
            "https://raw.githubusercontent.com/tsumotaka19/ObaCamera/main/icon.png" \
            -o /tmp/obacamera/app/src/main/res/drawable-nodpi/icon.png

          # アイコンが実際に取得できたことを確認
          test -s /tmp/obacamera/app/src/main/res/drawable-nodpi/icon.png

          echo "=== ICON FILE ==="
          ls -lh /tmp/obacamera/app/src/main/res/drawable-nodpi/icon.png
          file /tmp/obacamera/app/src/main/res/drawable-nodpi/icon.png

          # AndroidManifest.xmlを確実に書き換える
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("/tmp/obacamera/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          # 既存のicon / roundIconを全部削除
          s = re.sub(r'\s+android:icon="[^"]*"', '', s)
          s = re.sub(r'\s+android:roundIcon="[^"]*"', '', s)

          # applicationタグへ強制的に設定
          s = s.replace(
              '<application',
              '<application android:icon="@drawable/icon" android:roundIcon="@drawable/icon"',
              1
          )

          p.write_text(s)

          print("=== MANIFEST ===")
          print(s)
          PY

          # Manifestに正しく設定されたか確認
          grep -q 'android:icon="@drawable/icon"' \
            /tmp/obacamera/app/src/main/AndroidManifest.xml

          grep -q 'android:roundIcon="@drawable/icon"' \
            /tmp/obacamera/app/src/main/AndroidManifest.xml

          echo "=== ICON MANIFEST CHECK: OK ==="

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build APK
        working-directory: /tmp/obacamera
        run: |
          set -e
          gradle assembleDebug

      - name: Verify icon inside APK
        shell: bash
        run: |
          set -e

          APK="/tmp/obacamera/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"

          test -s "$APK"

          echo "=== APK SIZE ==="
          ls -lh "$APK"

          echo "=== ICON FILES INSIDE APK ==="
          unzip -l "$APK" | grep -E 'drawable.*/icon\.png'

          echo "=== APPLICATION ICON ==="
          "$AAPT" dump badging "$APK" | grep 'application-icon'

          echo "=== ICON VERIFICATION: OK ==="

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ObaCamera-FINAL-ICON
          path: /tmp/obacamera/app/build/outputs/apk/debug/app-debug.apk
