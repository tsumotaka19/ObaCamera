name: Build ObaCamera APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create project
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/obacamera

          # 現在のbuild.ymlからembedded project.zipを取得
          curl -fsSL \
            "https://raw.githubusercontent.com/tsumotaka19/ObaCamera/main/.github/workflows/build.yml" \
            -o /tmp/source.yml

          sed -n "s/.*echo '\([^']*\)' | base64 -d.*/\1/p" \
            /tmp/source.yml \
            | tr -d '[:space:]' \
            | base64 -d > /tmp/obacamera/project.zip

          test -s /tmp/obacamera/project.zip

          cd /tmp/obacamera
          unzip -q project.zip

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Create Android launcher icons
        shell: bash
        run: |
          set -e

          RES="/tmp/obacamera/app/src/main/res"

          curl -fsSL \
            "https://raw.githubusercontent.com/tsumotaka19/ObaCamera/main/icon.png?run=${GITHUB_RUN_ID}" \
            -o /tmp/icon.png

          test -s /tmp/icon.png

          rm -rf "$RES/mipmap-"*

          mkdir -p \
            "$RES/mipmap-mdpi" \
            "$RES/mipmap-hdpi" \
            "$RES/mipmap-xhdpi" \
            "$RES/mipmap-xxhdpi" \
            "$RES/mipmap-xxxhdpi"

          # Android標準のlauncher iconサイズ
          magick /tmp/icon.png -resize 48x48 \
            "$RES/mipmap-mdpi/ic_launcher.png"

          magick /tmp/icon.png -resize 72x72 \
            "$RES/mipmap-hdpi/ic_launcher.png"

          magick /tmp/icon.png -resize 96x96 \
            "$RES/mipmap-xhdpi/ic_launcher.png"

          magick /tmp/icon.png -resize 144x144 \
            "$RES/mipmap-xxhdpi/ic_launcher.png"

          magick /tmp/icon.png -resize 192x192 \
            "$RES/mipmap-xxxhdpi/ic_launcher.png"

          cp "$RES/mipmap-mdpi/ic_launcher.png" \
             "$RES/mipmap-mdpi/ic_launcher_round.png"

          cp "$RES/mipmap-hdpi/ic_launcher.png" \
             "$RES/mipmap-hdpi/ic_launcher_round.png"

          cp "$RES/mipmap-xhdpi/ic_launcher.png" \
             "$RES/mipmap-xhdpi/ic_launcher_round.png"

          cp "$RES/mipmap-xxhdpi/ic_launcher.png" \
             "$RES/mipmap-xxhdpi/ic_launcher_round.png"

          cp "$RES/mipmap-xxxhdpi/ic_launcher.png" \
             "$RES/mipmap-xxxhdpi/ic_launcher_round.png"

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("/tmp/obacamera/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          s = re.sub(r'\s+android:icon="[^"]*"', '', s)
          s = re.sub(r'\s+android:roundIcon="[^"]*"', '', s)

          s = s.replace(
              "<application",
              '<application '
              'android:icon="@mipmap/ic_launcher" '
              'android:roundIcon="@mipmap/ic_launcher_round"',
              1
          )

          p.write_text(s)
          PY

          grep -q 'android:icon="@mipmap/ic_launcher"' \
            /tmp/obacamera/app/src/main/AndroidManifest.xml

          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' \
            /tmp/obacamera/app/src/main/AndroidManifest.xml

          echo "ICON GENERATION OK"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build APK
        working-directory: /tmp/obacamera
        run: |
          gradle clean assembleDebug

      - name: Verify launcher icons inside APK
        shell: bash
        run: |
          set -e

          APK="/tmp/obacamera/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"

          test -s "$APK"

          echo "=== APK ICONS ==="

          unzip -l "$APK" | grep \
            -E 'mipmap-(mdpi|hdpi|xhdpi|xxhdpi|xxxhdpi)/ic_launcher(_round)?\.png'

          echo "=== MANIFEST ICON ==="

          "$AAPT" dump badging "$APK" | grep "application-icon"

          echo "=== FINAL ICON CHECK ==="
          echo "OK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ObaCamera-FINAL-ICON
          path: /tmp/obacamera/app/build/outputs/apk/debug/app-debug.apk
