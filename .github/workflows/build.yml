name: Build ObaCamera APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ========================================
      # 1. 元プロジェクトを取得
      # ========================================
      - name: Create project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/obacamera

          curl -fsSL \
            "https://raw.githubusercontent.com/tsumotaka19/ObaCamera/781a8a3/.github/workflows/build.yml" \
            -o /tmp/source.yml

          python3 - <<'PY'
          import re
          import base64
          from pathlib import Path

          source = Path("/tmp/source.yml").read_text()

          match = re.search(
              r"echo '([A-Za-z0-9+/=\s]+)'\s*\|\s*base64\s+-d",
              source,
              re.DOTALL
          )

          if not match:
              raise RuntimeError("Embedded project ZIP was not found")

          encoded = re.sub(r"\s+", "", match.group(1))
          data = base64.b64decode(encoded)

          if not data.startswith(b"PK"):
              raise RuntimeError("Decoded data is not a ZIP file")

          Path("/tmp/obacamera/project.zip").write_bytes(data)

          print("PROJECT ZIP:", len(data), "bytes")
          PY

          test -s /tmp/obacamera/project.zip

          cd /tmp/obacamera
          unzip -q project.zip

          test -f app/build.gradle
          test -f app/src/main/java/com/example/obacamera/MainActivity.java
          test -f app/src/main/AndroidManifest.xml

          echo "=== PROJECT CREATED ==="


      # ========================================
      # 2. ビルド環境を固定
      # ========================================
      - name: Configure build environment
        shell: bash
        run: |
          set -euo pipefail

          cd /tmp/obacamera

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  org.gradle.api.initialization.resolve.RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "ObaCamera"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          echo "=== BUILD ENVIRONMENT CONFIGURED ==="
          echo "AGP: 8.6.1"
          echo "Gradle: 8.7"
          echo "CameraX: 1.5.3"
          echo "Activity: 1.10.1"
          echo "compileSdk: 35"
          echo "JDK: 17"


      # ========================================
      # 3. CameraX + シャッター音 + MediaStore
      # ========================================
      - name: Upgrade camera implementation
        shell: bash
        run: |
          set -euo pipefail

          RES="/tmp/obacamera/app/src/main/res"

          mkdir -p "$RES/raw"

          # ----------------------------------------
          # カシャ系シャッター音をWAVとして生成
          # 44.1kHz / mono / 約0.18秒
          # ----------------------------------------
          python3 - <<'PY'
          import math
          import random
          import wave
          import struct
          from pathlib import Path

          sample_rate = 44100
          duration = 0.18
          total = int(sample_rate * duration)

          samples = []

          random.seed(12345)

          for i in range(total):
              t = i / sample_rate

              # 最初の鋭い「カ」
              click_env = math.exp(-t * 180.0)

              click = (
                  0.70 * math.sin(2.0 * math.pi * 3200.0 * t) +
                  0.35 * math.sin(2.0 * math.pi * 6100.0 * t) +
                  0.20 * math.sin(2.0 * math.pi * 9200.0 * t)
              ) * click_env

              # 続く「シャ」の短い機械的な響き
              noise_env = math.exp(-max(0.0, t - 0.008) * 32.0)

              noise = (
                  random.uniform(-1.0, 1.0)
                  * noise_env
                  * (1.0 if t >= 0.008 else 0.0)
              )

              body_env = math.exp(-max(0.0, t - 0.006) * 22.0)

              body = (
                  0.28 * math.sin(2.0 * math.pi * 850.0 * t) +
                  0.16 * math.sin(2.0 * math.pi * 1250.0 * t)
              ) * body_env

              value = click * 0.55 + noise * 0.18 + body * 0.35

              # わずかにフェードアウト
              fade = min(1.0, max(0.0, (duration - t) / 0.025))
              value *= fade

              value = max(-1.0, min(1.0, value))

              samples.append(int(value * 32767))

          output = Path(
              "/tmp/obacamera/app/src/main/res/raw/shutter.wav"
          )

          with wave.open(str(output), "wb") as wav:
              wav.setnchannels(1)
              wav.setsampwidth(2)
              wav.setframerate(sample_rate)

              for sample in samples:
                  wav.writeframes(
                      struct.pack("<h", sample)
                  )

          print("SHUTTER SOUND:", output)
          print("SAMPLES:", len(samples))
          PY

          test -s "$RES/raw/shutter.wav"


          # ----------------------------------------
          # app/build.gradle
          # ----------------------------------------
          cat > /tmp/obacamera/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.obacamera'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.example.obacamera'
                  minSdk 26
                  targetSdk 35
                  versionCode 2
                  versionName '1.1'
              }
          }

          dependencies {
              def camerax_version = "1.5.3"

              implementation "androidx.camera:camera-core:${camerax_version}"
              implementation "androidx.camera:camera-camera2:${camerax_version}"
              implementation "androidx.camera:camera-lifecycle:${camerax_version}"
              implementation "androidx.camera:camera-view:${camerax_version}"

              implementation "androidx.activity:activity:1.10.1"
          }
          EOF


          # ----------------------------------------
          # MainActivity.java
          # ----------------------------------------
          cat > /tmp/obacamera/app/src/main/java/com/example/obacamera/MainActivity.java <<'EOF'
          package com.example.obacamera;

          import android.Manifest;
          import android.content.ContentValues;
          import android.content.pm.PackageManager;
          import android.media.AudioAttributes;
          import android.media.SoundPool;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.view.Gravity;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.FrameLayout;
          import android.widget.Toast;

          import androidx.activity.ComponentActivity;
          import androidx.annotation.NonNull;
          import androidx.camera.core.CameraSelector;
          import androidx.camera.core.ImageCapture;
          import androidx.camera.core.ImageCaptureException;
          import androidx.camera.core.Preview;
          import androidx.camera.lifecycle.ProcessCameraProvider;
          import androidx.camera.view.PreviewView;
          import androidx.core.content.ContextCompat;

          import com.google.common.util.concurrent.ListenableFuture;


          public class MainActivity extends ComponentActivity {

              private static final int REQ_CAMERA = 10;

              private PreviewView previewView;
              private Button shutter;

              private ImageCapture imageCapture;
              private ProcessCameraProvider cameraProvider;

              private SoundPool soundPool;
              private int shutterSoundId = 0;
              private boolean soundReady = false;
              private boolean cameraReady = false;


              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().setStatusBarColor(0xFF000000);
                  getWindow().setNavigationBarColor(0xFF000000);

                  getWindow().addFlags(
                          WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON
                  );


                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(0xFF000000);


                  previewView = new PreviewView(this);

                  previewView.setImplementationMode(
                          PreviewView.ImplementationMode.PERFORMANCE
                  );

                  previewView.setScaleType(
                          PreviewView.ScaleType.FILL_CENTER
                  );


                  root.addView(
                          previewView,
                          new FrameLayout.LayoutParams(
                                  -1,
                                  -1
                          )
                  );


                  shutter = new Button(this);

                  shutter.setText("写真を撮る");
                  shutter.setTextSize(22);
                  shutter.setTextColor(0xFF000000);
                  shutter.setAllCaps(false);
                  shutter.setBackgroundColor(0xFFFFFFFF);
                  shutter.setEnabled(false);


                  FrameLayout.LayoutParams shutterParams =
                          new FrameLayout.LayoutParams(
                                  -1,
                                  dp(92),
                                  Gravity.BOTTOM
                          );

                  shutterParams.setMargins(
                          dp(24),
                          dp(24),
                          dp(24),
                          dp(24)
                  );


                  root.addView(
                          shutter,
                          shutterParams
                  );


                  shutter.setOnClickListener(
                          v -> takePhoto()
                  );


                  setContentView(root);


                  initializeShutterSound();


                  if (
                          checkSelfPermission(
                                  Manifest.permission.CAMERA
                          ) != PackageManager.PERMISSION_GRANTED
                  ) {

                      requestPermissions(
                              new String[]{
                                      Manifest.permission.CAMERA
                              },
                              REQ_CAMERA
                      );

                  } else {

                      startCamera();
                  }
              }


              private void initializeShutterSound() {

                  AudioAttributes audioAttributes =
                          new AudioAttributes.Builder()
                                  .setUsage(
                                          AudioAttributes.USAGE_ASSISTANCE_SONIFICATION
                                  )
                                  .setContentType(
                                          AudioAttributes.CONTENT_TYPE_SONIFICATION
                                  )
                                  .build();


                  soundPool =
                          new SoundPool.Builder()
                                  .setMaxStreams(1)
                                  .setAudioAttributes(audioAttributes)
                                  .build();


                  soundPool.setOnLoadCompleteListener(
                          (pool, sampleId, status) -> {

                              if (status == 0 &&
                                      sampleId == shutterSoundId) {

                                  soundReady = true;
                                  updateShutterState();
                              }
                          }
                  );


                  shutterSoundId =
                          soundPool.load(
                                  this,
                                  R.raw.shutter,
                                  1
                          );
              }


              private void updateShutterState() {

                  shutter.setEnabled(
                          cameraReady && soundReady
                  );
              }


              private int dp(int value) {

                  return (int) (
                          value *
                          getResources()
                                  .getDisplayMetrics()
                                  .density
                          + 0.5f
                  );
              }


              private void startCamera() {

                  cameraReady = false;
                  updateShutterState();


                  ListenableFuture<ProcessCameraProvider> future =
                          ProcessCameraProvider.getInstance(this);


                  future.addListener(
                          () -> {

                              try {

                                  cameraProvider = future.get();

                                  cameraProvider.unbindAll();


                                  Preview preview =
                                          new Preview.Builder()
                                                  .build();


                                  preview.setSurfaceProvider(
                                          previewView
                                                  .getSurfaceProvider()
                                  );


                                  imageCapture =
                                          new ImageCapture.Builder()
                                                  .setCaptureMode(
                                                          ImageCapture
                                                                  .CAPTURE_MODE_MINIMIZE_LATENCY
                                                  )
                                                  .setTargetRotation(
                                                          previewView
                                                                  .getDisplay()
                                                                  .getRotation()
                                                  )
                                                  .build();


                                  CameraSelector selector =
                                          CameraSelector
                                                  .DEFAULT_BACK_CAMERA;


                                  cameraProvider.bindToLifecycle(
                                          this,
                                          selector,
                                          preview,
                                          imageCapture
                                  );


                                  cameraReady = true;
                                  updateShutterState();


                              } catch (Exception e) {

                                  cameraReady = false;
                                  updateShutterState();


                                  Toast.makeText(
                                          this,
                                          "カメラを開始できませんでした",
                                          Toast.LENGTH_SHORT
                                  ).show();
                              }

                          },
                          ContextCompat.getMainExecutor(this)
                  );
              }


              private void takePhoto() {

                  if (
                          imageCapture == null ||
                          !cameraReady ||
                          !soundReady
                  ) {
                      return;
                  }


                  shutter.setEnabled(false);


                  long now =
                          System.currentTimeMillis();


                  ContentValues values =
                          new ContentValues();


                  values.put(
                          MediaStore.Images.Media.DISPLAY_NAME,
                          "IMG_" + now + ".jpg"
                  );


                  values.put(
                          MediaStore.Images.Media.MIME_TYPE,
                          "image/jpeg"
                  );


                  if (
                          Build.VERSION.SDK_INT >=
                                  Build.VERSION_CODES.Q
                  ) {

                      values.put(
                              MediaStore.Images.Media.RELATIVE_PATH,
                              Environment.DIRECTORY_DCIM +
                                      "/Camera"
                      );


                      values.put(
                              MediaStore.Images.Media.IS_PENDING,
                              1
                      );
                  }


                  ImageCapture.OutputFileOptions outputOptions =
                          new ImageCapture.OutputFileOptions.Builder(
                                  getContentResolver(),
                                  MediaStore.Images.Media.EXTERNAL_CONTENT_URI,
                                  values
                          ).build();


                  // 「カシャ」系シャッター音
                  // 左右とも0.5 = 約50%
                  soundPool.play(
                          shutterSoundId,
                          0.5f,
                          0.5f,
                          1,
                          0,
                          1.0f
                  );


                  imageCapture.takePicture(
                          outputOptions,
                          ContextCompat.getMainExecutor(this),

                          new ImageCapture.OnImageSavedCallback() {

                              @Override
                              public void onImageSaved(
                                      @NonNull
                                      ImageCapture.OutputFileResults result
                              ) {

                                  if (
                                          Build.VERSION.SDK_INT >=
                                                  Build.VERSION_CODES.Q &&
                                          result.getSavedUri() != null
                                  ) {

                                      ContentValues publish =
                                              new ContentValues();

                                      publish.put(
                                              MediaStore.Images.Media
                                                      .IS_PENDING,
                                              0
                                      );

                                      getContentResolver().update(
                                              result.getSavedUri(),
                                              publish,
                                              null,
                                              null
                                      );
                                  }


                                  updateShutterState();


                                  Toast.makeText(
                                          MainActivity.this,
                                          "写真を保存しました",
                                          Toast.LENGTH_SHORT
                                  ).show();
                              }


                              @Override
                              public void onError(
                                      @NonNull
                                      ImageCaptureException exception
                              ) {

                                  updateShutterState();


                                  Toast.makeText(
                                          MainActivity.this,
                                          "撮影に失敗しました",
                                          Toast.LENGTH_SHORT
                                  ).show();
                              }
                          }
                  );
              }


              @Override
              public void onRequestPermissionsResult(
                      int requestCode,
                      @NonNull String[] permissions,
                      @NonNull int[] grantResults
              ) {

                  super.onRequestPermissionsResult(
                          requestCode,
                          permissions,
                          grantResults
                  );


                  if (
                          requestCode == REQ_CAMERA &&
                          grantResults.length > 0 &&
                          grantResults[0] ==
                                  PackageManager.PERMISSION_GRANTED
                  ) {

                      startCamera();

                  } else if (
                          requestCode == REQ_CAMERA
                  ) {

                      Toast.makeText(
                              this,
                              "カメラの権限が必要です",
                              Toast.LENGTH_SHORT
                      ).show();
                  }
              }


              @Override
              protected void onDestroy() {

                  if (cameraProvider != null) {
                      cameraProvider.unbindAll();
                  }


                  if (soundPool != null) {
                      soundPool.release();
                      soundPool = null;
                  }


                  super.onDestroy();
              }
          }
          EOF


          echo "=== CAMERA + SHUTTER SOUND READY ==="


      # ========================================
      # 4. 最終アイコン
      # ========================================
      - name: Install final launcher icon
        shell: bash
        run: |

          set -euo pipefail

          RES="/tmp/obacamera/app/src/main/res"
          MANIFEST="/tmp/obacamera/app/src/main/AndroidManifest.xml"


          rm -rf \
            "$RES/mipmap" \
            "$RES/mipmap-mdpi" \
            "$RES/mipmap-hdpi" \
            "$RES/mipmap-xhdpi" \
            "$RES/mipmap-xxhdpi" \
            "$RES/mipmap-xxxhdpi" \
            "$RES/mipmap-anydpi" \
            "$RES/mipmap-anydpi-v26" \
            "$RES/mipmap-nodpi"


          mkdir -p "$RES/mipmap-nodpi"


          curl -fsSL \
            "https://raw.githubusercontent.com/tsumotaka19/ObaCamera/main/icon.png?run=${GITHUB_RUN_ID}" \
            -o "$RES/mipmap-nodpi/ic_launcher.png"


          test -s \
            "$RES/mipmap-nodpi/ic_launcher.png"


          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "/tmp/obacamera/app/src/main/res/mipmap-nodpi/ic_launcher.png"
          )

          if not p.read_bytes().startswith(
              b"\x89PNG\r\n\x1a\n"
          ):
              raise RuntimeError(
                  "Final icon is not PNG"
              )

          print("FINAL ICON: OK")
          PY


          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path(
              "/tmp/obacamera/app/src/main/AndroidManifest.xml"
          )

          s = p.read_text()

          s = re.sub(
              r'\s+android:icon\s*=\s*"[^"]*"',
              '',
              s
          )

          s = re.sub(
              r'\s+android:roundIcon\s*=\s*"[^"]*"',
              '',
              s
          )

          s = s.replace(
              '<application',
              '<application android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher"',
              1
          )

          p.write_text(s)
          PY


          grep -q \
            'android:icon="@mipmap/ic_launcher"' \
            "$MANIFEST"


          echo "=== ICON INSTALL SUCCESS ==="


      # ========================================
      # 5. Java / Android SDK
      # ========================================
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      - name: Set up Android SDK
        uses: android-actions/setup-android@v4


      - name: Install Android SDK packages
        shell: bash
        run: |

          set -euo pipefail

          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # ========================================
      # 6. Gradle
      # ========================================
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'


      # ========================================
      # 7. APK Build
      # ========================================
      - name: Build APK
        working-directory: /tmp/obacamera
        shell: bash
        run: |

          set -euo pipefail

          echo "=== BUILD ENVIRONMENT ==="

          java -version

          gradle --version

          echo "=== BUILD APK ==="

          gradle clean assembleDebug


          APK="/tmp/obacamera/app/build/outputs/apk/debug/app-debug.apk"


          test -s "$APK"


          echo "=== APK BUILD SUCCESS ==="

          ls -lh "$APK"


      # ========================================
      # 8. APK検査
      # ========================================
      - name: Verify APK
        shell: bash
        run: |

          set -euo pipefail

          APK="/tmp/obacamera/app/build/outputs/apk/debug/app-debug
