name: Build ObaCamera APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Create project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/obacamera

          curl -fsSL \
            "https://raw.githubusercontent.com/tsumotaka19/ObaCamera/781a8a3/.github/workflows/build.yml" \
            -o /tmp/source.yml

          python3 - <<'PY'
          import re
          import base64
          from pathlib import Path

          source = Path("/tmp/source.yml").read_text()

          match = re.search(
              r"echo '([A-Za-z0-9+/=\s]+)'\s*\|\s*base64\s+-d",
              source,
              re.DOTALL
          )

          if not match:
              raise RuntimeError("Embedded project ZIP was not found")

          data = base64.b64decode(
              re.sub(r"\s+", "", match.group(1))
          )

          if not data.startswith(b"PK"):
              raise RuntimeError("Decoded project is not a ZIP")

          Path(
              "/tmp/obacamera/project.zip"
          ).write_bytes(data)
          PY

          cd /tmp/obacamera

          unzip -q project.zip

          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

          echo "=== PROJECT CREATED ==="


      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      - name: Set up Android SDK
        uses: android-actions/setup-android@v4


      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "=== ANDROID SDK READY ==="


      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'


      - name: Build APK
        working-directory: /tmp/obacamera
        shell: bash
        run: |
          set -euo pipefail

          cat > settings.gradle <<'SETTINGS_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  org.gradle.api.initialization.resolve.RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "ObaCamera"

          include(":app")
          SETTINGS_EOF


          cat > build.gradle <<'ROOT_EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          ROOT_EOF


          cat > app/build.gradle <<'APP_EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.obacamera'

              compileSdk 35

              defaultConfig {
                  applicationId 'com.example.obacamera'
                  minSdk 26
                  targetSdk 35
                  versionCode 2
                  versionName '1.1'
              }
          }

          dependencies {
              def camerax_version = "1.5.3"

              implementation "androidx.camera:camera-core:${camerax_version}"
              implementation "androidx.camera:camera-camera2:${camerax_version}"
              implementation "androidx.camera:camera-lifecycle:${camerax_version}"
              implementation "androidx.camera:camera-view:${camerax_version}"
              implementation "androidx.activity:activity:1.10.1"
          }
          APP_EOF


          cat > app/src/main/java/com/example/obacamera/MainActivity.java <<'JAVA_EOF'
          package com.example.obacamera;

          import android.Manifest;
          import android.content.ContentValues;
          import android.content.Context;
          import android.content.pm.PackageManager;
          import android.graphics.Rect;
          import android.media.SoundPool;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.SparseBooleanArray;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.FrameLayout;
          import android.widget.Toast;

          import androidx.activity.ComponentActivity;
          import androidx.annotation.NonNull;
          import androidx.camera.core.CameraSelector;
          import androidx.camera.core.ImageCapture;
          import androidx.camera.core.ImageCaptureException;
          import androidx.camera.core.Preview;
          import androidx.camera.lifecycle.ProcessCameraProvider;
          import androidx.camera.view.PreviewView;
          import androidx.core.content.ContextCompat;

          import com.google.common.util.concurrent.ListenableFuture;


          public class MainActivity extends ComponentActivity {

              private static final int REQ_CAMERA = 10;

              private PreviewView previewView;
              private Button shutter;

              private ImageCapture imageCapture;
              private ProcessCameraProvider cameraProvider;

              private SoundPool soundPool;
              private int shutterSoundId;

              private boolean soundReady = false;
              private boolean cameraReady = false;

              private final SparseBooleanArray
                      pointerInsideButton =
                      new SparseBooleanArray();


              @Override
              protected void onCreate(
                      Bundle savedInstanceState
              ) {

                  super.onCreate(savedInstanceState);

                  getWindow().setStatusBarColor(
                          0xFF000000
                  );

                  getWindow().setNavigationBarColor(
                          0xFF000000
                  );

                  getWindow().addFlags(
                          WindowManager.LayoutParams
                                  .FLAG_KEEP_SCREEN_ON
                  );


                  TouchFrameLayout root =
                          new TouchFrameLayout(this);

                  root.setBackgroundColor(
                          0xFF000000
                  );


                  previewView =
                          new PreviewView(this);

                  previewView.setImplementationMode(
                          PreviewView
                                  .ImplementationMode
                                  .PERFORMANCE
                  );

                  previewView.setScaleType(
                          PreviewView
                                  .ScaleType
                                  .FILL_CENTER
                  );


                  root.addView(
                          previewView,
                          new FrameLayout.LayoutParams(
                                  -1,
                                  -1
                          )
                  );


                  shutter =
                          new Button(this);

                  shutter.setText(
                          "写真を撮る"
                  );

                  shutter.setTextSize(22);

                  shutter.setTextColor(
                          0xFF000000
                  );

                  shutter.setAllCaps(false);

                  shutter.setBackgroundColor(
                          0xFFFFFFFF
                  );

                  shutter.setEnabled(false);

                  shutter.setClickable(false);

                  shutter.setFocusable(false);


                  int screenWidth =
                          getResources()
                                  .getDisplayMetrics()
                                  .widthPixels;


                  int shutterWidth =
                          (int)(
                                  screenWidth * 0.60f
                          );


                  FrameLayout.LayoutParams
                          shutterParams =
                          new FrameLayout.LayoutParams(
                                  shutterWidth,
                                  dp(92),
                                  Gravity.BOTTOM |
                                          Gravity.CENTER_HORIZONTAL
                          );


                  shutterParams.setMargins(
                          0,
                          dp(24),
                          0,
                          dp(24)
                  );


                  root.addView(
                          shutter,
                          shutterParams
                  );


                  setContentView(root);

                  initializeShutterSound();


                  if (
                          checkSelfPermission(
                                  Manifest.permission.CAMERA
                          )
                          != PackageManager.PERMISSION_GRANTED
                  ) {

                      requestPermissions(
                              new String[]{
                                      Manifest.permission.CAMERA
                              },
                              REQ_CAMERA
                      );

                  } else {

                      startCamera();
                  }
              }


              private void initializeShutterSound() {

                  soundPool =
                          new SoundPool.Builder()
                                  .setMaxStreams(4)
                                  .build();


                  soundPool.setOnLoadCompleteListener(
                          (pool, sampleId, status) -> {

                              if (
                                      status == 0 &&
                                      sampleId ==
                                              shutterSoundId
                              ) {

                                  soundReady = true;

                                  updateShutterState();
                              }
                          }
                  );


                  shutterSoundId =
                          soundPool.load(
                                  this,
                                  R.raw.shutter,
                                  1
                          );
              }


              private void updateShutterState() {

                  shutter.setEnabled(
                          cameraReady &&
                                  soundReady
                  );
              }


              private int dp(
                      int value
              ) {

                  return (int)(
                          value *
                                  getResources()
                                          .getDisplayMetrics()
                                          .density
                                  + 0.5f
                  );
              }


              private void startCamera() {

                  cameraReady = false;

                  updateShutterState();


                  ListenableFuture<
                          ProcessCameraProvider
                          > future =
                          ProcessCameraProvider
                                  .getInstance(this);


                  future.addListener(
                          () -> {

                              try {

                                  cameraProvider =
                                          future.get();

                                  cameraProvider
                                          .unbindAll();


                                  Preview preview =
                                          new Preview.Builder()
                                                  .build();


                                  preview.setSurfaceProvider(
                                          previewView
                                                  .getSurfaceProvider()
                                  );


                                  imageCapture =
                                          new ImageCapture.Builder()
                                                  .setCaptureMode(
                                                          ImageCapture
                                                                  .CAPTURE_MODE_MINIMIZE_LATENCY
                                                  )
                                                  .setTargetRotation(
                                                          previewView
                                                                  .getDisplay()
                                                                  .getRotation()
                                                  )
                                                  .build();


                                  CameraSelector selector =
                                          CameraSelector
                                                  .DEFAULT_BACK_CAMERA;


                                  cameraProvider
                                          .bindToLifecycle(
                                                  this,
                                                  selector,
                                                  preview,
                                                  imageCapture
                                          );


                                  cameraReady = true;

                                  updateShutterState();


                              } catch (
                                      Exception e
                              ) {

                                  cameraReady = false;

                                  updateShutterState();


                                  Toast.makeText(
                                          this,
                                          "カメラを開始できませんでした",
                                          Toast.LENGTH_SHORT
                                  ).show();
                              }

                          },
                          ContextCompat
                                  .getMainExecutor(this)
                  );
              }


              private void takePhoto() {

                  if (
                          imageCapture == null ||
                          !cameraReady ||
                          !soundReady
                  ) {

                      return;
                  }


                  long now =
                          System.currentTimeMillis();


                  ContentValues values =
                          new ContentValues();


                  values.put(
                          MediaStore.Images.Media
                                  .DISPLAY_NAME,
                          "IMG_" + now + ".jpg"
                  );


                  values.put(
                          MediaStore.Images.Media
                                  .MIME_TYPE,
                          "image/jpeg"
                  );


                  if (
                          Build.VERSION.SDK_INT >=
                                  Build.VERSION_CODES.Q
                  ) {

                      values.put(
                              MediaStore.Images.Media
                                      .RELATIVE_PATH,
                              Environment
                                      .DIRECTORY_DCIM +
                                      "/Camera"
                      );

                      values.put(
                              MediaStore.Images.Media
                                      .IS_PENDING,
                              1
                      );
                  }


                  ImageCapture
                          .OutputFileOptions
                          outputOptions =
                          new ImageCapture
                                  .OutputFileOptions
                                  .Builder(
                                          getContentResolver(),
                                          MediaStore.Images.Media
                                                  .EXTERNAL_CONTENT_URI,
                                          values
                                  )
                                  .build();


                  soundPool.play(
                          shutterSoundId,
                          0.7f,
                          0.7f,
                          1,
                          0,
                          1.0f
                  );


                  imageCapture.takePicture(
                          outputOptions,
                          ContextCompat
                                  .getMainExecutor(this),

                          new ImageCapture
                                  .OnImageSavedCallback() {

                              @Override
                              public void onImageSaved(
                                      @NonNull
                                      ImageCapture
                                              .OutputFileResults
                                              result
                              ) {

                                  if (
                                          Build.VERSION.SDK_INT >=
                                                  Build.VERSION_CODES.Q &&
                                          result.getSavedUri() != null
                                  ) {

                                      ContentValues publish =
                                              new ContentValues();

                                      publish.put(
                                              MediaStore.Images.Media
                                                      .IS_PENDING,
                                              0
                                      );

                                      getContentResolver()
                                              .update(
                                                      result.getSavedUri(),
                                                      publish,
                                                      null,
                                                      null
                                              );
                                  }


                                  Toast.makeText(
                                          MainActivity.this,
                                          "写真を保存しました",
                                          Toast.LENGTH_SHORT
                                  ).show();
                              }


                              @Override
                              public void onError(
                                      @NonNull
                                      ImageCaptureException
                                              exception
                              ) {

                                  Toast.makeText(
                                          MainActivity.this,
                                          "撮影に失敗しました",
                                          Toast.LENGTH_SHORT
                                  ).show();
                              }
                          }
                  );
              }


              private void inspectTouchEvent(
                      MotionEvent event
              ) {

                  if (
                          shutter == null
                  ) {
                      return;
                  }


                  int action =
                          event.getActionMasked();

                  int actionIndex =
                          event.getActionIndex();


                  Rect buttonRect =
                          new Rect();


                  shutter.getHitRect(
                          buttonRect
                  );


                  if (
                          action ==
                                  MotionEvent.ACTION_DOWN
                  ) {

                      int pointerId =
                              event.getPointerId(0);

                      float x =
                              event.getX(0);

                      float y =
                              event.getY(0);

                      boolean inside =
                              buttonRect.contains(
                                      (int)x,
                                      (int)y
                              );

                      pointerInsideButton.put(
                              pointerId,
                              inside
                      );


                      if (inside) {
                          takePhoto();
                      }

                      return;
                  }


                  if (
                          action ==
                                  MotionEvent
                                          .ACTION_POINTER_DOWN
                  ) {

                      int pointerId =
                              event.getPointerId(
                                      actionIndex
                              );

                      float x =
                              event.getX(
                                      actionIndex
                              );

                      float y =
                              event.getY(
                                      actionIndex
                              );

                      boolean inside =
                              buttonRect.contains(
                                      (int)x,
                                      (int)y
                              );

                      pointerInsideButton.put(
                              pointerId,
                              inside
                      );


                      if (inside) {
                          takePhoto();
                      }

                      return;
                  }


                  if (
                          action ==
                                  MotionEvent.ACTION_MOVE
                  ) {

                      int pointerCount =
                              event.getPointerCount();


                      for (
                              int i = 0;
                              i < pointerCount;
                              i++
                      ) {

                          int pointerId =
                                  event.getPointerId(i);

                          float x =
                                  event.getX(i);

                          float y =
                                  event.getY(i);

                          boolean inside =
                                  buttonRect.contains(
                                          (int)x,
                                          (int)y
                                  );

                          boolean wasInside =
                                  pointerInsideButton.get(
                                          pointerId,
                                          false
                                  );


                          if (
                                  inside &&
                                  !wasInside
                          ) {
                              takePhoto();
                          }


                          pointerInsideButton.put(
                                  pointerId,
                                  inside
                          );
                      }

                      return;
                  }


                  if (
                          action ==
                                  MotionEvent
                                          .ACTION_POINTER_UP
                  ) {

                      int pointerId =
                              event.getPointerId(
                                      actionIndex
                              );

                      pointerInsideButton.delete(
                              pointerId
                      );

                      return;
                  }


                  if (
                          action ==
                                  MotionEvent.ACTION_UP ||
                          action ==
                                  MotionEvent.ACTION_CANCEL
                  ) {

                      pointerInsideButton.clear();
                  }
              }


              private class TouchFrameLayout
                      extends FrameLayout {

                  TouchFrameLayout(
                          Context context
                  ) {
                      super(context);
                  }


                  @Override
                  public boolean dispatchTouchEvent(
                          MotionEvent event
                  ) {

                      inspectTouchEvent(
                              event
                      );

                      return super.dispatchTouchEvent(
                              event
                      );
                  }
              }


              @Override
              public void onRequestPermissionsResult(
                      int requestCode,
                      @NonNull String[] permissions,
                      @NonNull int[] grantResults
              ) {

                  super.onRequestPermissionsResult(
                          requestCode,
                          permissions,
                          grantResults
                  );


                  if (
                          requestCode == REQ_CAMERA &&
                          grantResults.length > 0 &&
                          grantResults[0] ==
                                  PackageManager
                                          .PERMISSION_GRANTED
                  ) {

                      startCamera();

                  } else if (
                          requestCode == REQ_CAMERA
                  ) {

                      Toast.makeText(
                              this,
                              "カメラの権限が必要です",
                              Toast.LENGTH_SHORT
                      ).show();
                  }
              }


              @Override
              protected void onDestroy() {

                  if (
                          cameraProvider != null
                  ) {

                      cameraProvider
                              .unbindAll();
                  }


                  if (
                          soundPool != null
                  ) {

                      soundPool.release();

                      soundPool = null;
                  }


                  super.onDestroy();
              }
          }
          JAVA_EOF


          test -s \
            app/src/main/java/com/example/obacamera/MainActivity.java

          grep -q \
            "dispatchTouchEvent" \
            app/src/main/java/com/example/obacamera/MainActivity.java

          grep -q \
            "ACTION_POINTER_DOWN" \
            app/src/main/java/com/example/obacamera/MainActivity.java

          grep -q \
            "ACTION_POINTER_UP" \
            app/src/main/java/com/example/obacamera/MainActivity.java

          grep -q \
            "getPointerCount()" \
            app/src/main/java/com/example/obacamera/MainActivity.java

          grep -q \
            "getPointerId" \
            app/src/main/java/com/example/obacamera/MainActivity.java

          grep -q \
            "SparseBooleanArray" \
            app/src/main/java/com/example/obacamera/MainActivity.java

          grep -q \
            "0.60f" \
            app/src/main/java/com/example/obacamera/MainActivity.java

          grep -q \
            "0.7f" \
            app/src/main/java/com/example/obacamera/MainActivity.java

          echo "=== MAIN ACTIVITY READY ==="


          mkdir -p app/src/main/res/raw

          python3 - <<'PY'
          import math
          import random
          import struct
          import wave
          from pathlib import Path

          sr = 16000
          duration = 0.085
          count = int(sr * duration)

          rng = random.Random(7319)

          lp1 = 0.0
          lp2 = 0.0

          samples = []

          events = [
              (0.000, 0.72, 0.006),
              (0.030, 0.58, 0.010),
              (0.064, 0.48, 0.011),
          ]

          for i in range(count):

              t = i / sr
              value = 0.0

              for onset, amp, tau in events:

                  u = t - onset

                  if u < 0.0:
                      continue

                  env = math.exp(
                      -u / tau
                  )

                  env *= min(
                      1.0,
                      u / 0.0006
                  )

                  r = rng.uniform(
                      -1.0,
                      1.0
                  )

                  lp1 += 0.18 * (
                      r - lp1
                  )

                  hp = r - lp1

                  r2 = rng.uniform(
                      -1.0,
                      1.0
                  )

                  lp2 += 0.055 * (
                      r2 - lp2
                  )

                  texture = (
                      0.62 * hp
                      + 0.20 * lp2
                      + 0.10 * math.sin(
                          2.0 *
                          math.pi *
                          1850.0 *
                          u
                      )
                      + 0.05 * math.sin(
                          2.0 *
                          math.pi *
                          3100.0 *
                          u
                      )
                  )

                  value += (
                      amp *
                      texture *
                      env
                  )


              if t >= 0.017:

                  u = t - 0.017

                  value += (
                      0.055 *
                      rng.uniform(
                          -1.0,
                          1.0
                      ) *
                      math.exp(
                          -u / 0.018
                      )
                  )


              samples.append(
                  value
              )


          peak = max(
              abs(x)
              for x in samples
          ) or 1.0


          samples = [
              max(
                  -1.0,
                  min(
                      1.0,
                      x / peak * 0.70
                  )
              )
              for x in samples
          ]


          output = Path(
              "app/src/main/res/raw/shutter.wav"
          )


          with wave.open(
              str(output),
              "wb"
          ) as wav:

              wav.setnchannels(1)
              wav.setsampwidth(2)
              wav.setframerate(sr)

              for value in samples:

                  wav.writeframes(
                      struct.pack(
                          "<h",
                          int(
                              value *
                              32767
                          )
                      )
                  )


          with wave.open(
              str(output),
              "rb"
          ) as wav:

              assert wav.getframerate() == 16000
              assert wav.getnchannels() == 1
              assert wav.getsampwidth() == 2


          print("SHUTTER WAV: OK")
          print(
              "BYTES:",
              output.stat().st_size
          )
          print(
              "DURATION:",
              duration
          )
          PY


          RES="app/src/main/res"
          MANIFEST="app/src/main/AndroidManifest.xml"

          rm -rf \
            "$RES/mipmap" \
            "$RES/mipmap-mdpi" \
            "$RES/mipmap-hdpi" \
            "$RES/mipmap-xhdpi" \
            "$RES/mipmap-xxhdpi" \
            "$RES/mipmap-xxxhdpi" \
            "$RES/mipmap-anydpi" \
            "$RES/mipmap-anydpi-v26" \
            "$RES/mipmap-nodpi"

          mkdir -p \
            "$RES/mipmap-nodpi"

          curl -fsSL \
            "https://raw.githubusercontent.com/tsumotaka19/ObaCamera/main/icon.png?run=${GITHUB_RUN_ID}" \
            -o \
            "$RES/mipmap-nodpi/ic_launcher.png"

          test -s \
            "$RES/mipmap-nodpi/ic_launcher.png"


          python3 - <<'PY'
          from pathlib import Path
          import re

          icon = Path(
              "app/src/main/res/mipmap-nodpi/ic_launcher.png"
          )

          if not icon.read_bytes().startswith(
              b"\x89PNG\r\n\x1a\n"
          ):
              raise RuntimeError(
                  "Final icon is not PNG"
              )


          manifest = Path(
              "app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text()


          text = re.sub(
              r'\s+android:icon\s*=\s*"[^"]*"',
              '',
              text
          )

          text = re.sub(
              r'\s+android:roundIcon\s*=\s*"[^"]*"',
              '',
              text
          )


          text = text.replace(
              "<application",
              '<application android:icon="@mipmap/ic_launcher" '
              'android:roundIcon="@mipmap/ic_launcher"',
              1
          )


          manifest.write_text(
              text
          )


          print("ICON: OK")
          print("MANIFEST: OK")
          PY


          echo "=== BUILD APK START ==="

          java -version

          gradle --version

          gradle clean assembleDebug


          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          echo "=== APK BUILD SUCCESS ==="

          ls -lh "$APK"


      - name: Verify APK
        working-directory: /tmp/obacamera
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          AAPT2="$ANDROID_HOME/build-tools/35.0.0/aapt2"

          test -s "$APK"

          echo "=== APK BADGING ==="

          "$AAPT2" dump badging "$APK"

          echo "=== RESOURCE CHECK ==="

          "$AAPT2" dump resources "$APK" | grep -E \
            "shutter|ic_launcher" | head -50 || true

          echo "=== VERIFY APK SUCCESS ==="


      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: ObaCamera-FINAL-ICON-CAMERAX
          path: /tmp/obacamera/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error


      - name: Build completed
        shell: bash
        run: |
          set -euo pipefail

          test -s \
            /tmp/obacamera/app/build/outputs/apk/debug/app-debug.apk

          echo "=== OBA CAMERA APK BUILD COMPLETE ==="
