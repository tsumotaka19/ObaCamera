name: Build ObaCamera APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/obacamera

          curl -fsSL \
            "https://raw.githubusercontent.com/tsumotaka19/ObaCamera/781a8a3/.github/workflows/build.yml" \
            -o /tmp/source.yml

          python3 - <<'PY'
          import re
          import base64
          from pathlib import Path

          source = Path("/tmp/source.yml").read_text()

          match = re.search(
              r"echo '([A-Za-z0-9+/=\s]+)'\s*\|\s*base64\s+-d",
              source,
              re.DOTALL
          )

          if not match:
              raise RuntimeError("Embedded project ZIP was not found")

          encoded = re.sub(r"\s+", "", match.group(1))
          data = base64.b64decode(encoded)

          if not data.startswith(b"PK"):
              raise RuntimeError("Decoded data is not a ZIP file")

          Path("/tmp/obacamera/project.zip").write_bytes(data)

          print("PROJECT ZIP:", len(data), "bytes")
          PY

          test -s /tmp/obacamera/project.zip

          cd /tmp/obacamera
          unzip -q project.zip

          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

          echo "=== PROJECT CREATED ==="

      - name: Install final launcher icon
        shell: bash
        run: |
          set -euo pipefail

          RES="/tmp/obacamera/app/src/main/res"
          MANIFEST="/tmp/obacamera/app/src/main/AndroidManifest.xml"
          ICON="$RES/mipmap-nodpi/ic_launcher.png"

          rm -rf \
            "$RES/mipmap" \
            "$RES/mipmap-mdpi" \
            "$RES/mipmap-hdpi" \
            "$RES/mipmap-xhdpi" \
            "$RES/mipmap-xxhdpi" \
            "$RES/mipmap-xxxhdpi" \
            "$RES/mipmap-anydpi" \
            "$RES/mipmap-anydpi-v26" \
            "$RES/mipmap-nodpi"

          mkdir -p "$RES/mipmap-nodpi"

          curl -fsSL \
            "https://raw.githubusercontent.com/tsumotaka19/ObaCamera/main/icon.png?run=${GITHUB_RUN_ID}" \
            -o "$ICON"

          test -s "$ICON"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("/tmp/obacamera/app/src/main/res/mipmap-nodpi/ic_launcher.png")
          data = p.read_bytes()

          if not data.startswith(b"\x89PNG\r\n\x1a\n"):
              raise RuntimeError("Downloaded icon is not PNG")

          print("FINAL ICON PNG: OK")
          print("ICON SIZE:", len(data), "bytes")
          PY

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("/tmp/obacamera/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          s = re.sub(
              r'\s+android:icon\s*=\s*"[^"]*"',
              '',
              s
          )

          s = re.sub(
              r'\s+android:roundIcon\s*=\s*"[^"]*"',
              '',
              s
          )

          if '<application' not in s:
              raise RuntimeError("application tag not found")

          s = s.replace(
              '<application',
              '<application android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher"',
              1
          )

          p.write_text(s)
          PY

          grep -q 'android:icon="@mipmap/ic_launcher"' "$MANIFEST"
          grep -q 'android:roundIcon="@mipmap/ic_launcher"' "$MANIFEST"

          echo "=== MANIFEST ICON ==="
          grep '<application' "$MANIFEST"

          echo "=== ICON INSTALL SUCCESS ==="

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build APK
        working-directory: /tmp/obacamera
        shell: bash
        run: |
          set -euo pipefail

          gradle clean assembleDebug

          APK="/tmp/obacamera/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          echo "=== APK BUILD SUCCESS ==="
          ls -lh "$APK"

      - name: Verify final icon
        shell: bash
        run: |
          set -euo pipefail

          APK="/tmp/obacamera/app/build/outputs/apk/debug/app-debug.apk"
          AAPT2="$ANDROID_HOME/build-tools/35.0.0/aapt2"

          test -s "$APK"

          echo "================================"
          echo "APK"
          echo "================================"
          ls -lh "$APK"

          echo "================================"
          echo "MANIFEST / BADGING"
          echo "================================"

          "$AAPT2" dump badging "$APK" | grep -E \
            "application:|launchable activity"

          echo "================================"
          echo "SEARCHING APK RESOURCE TABLE"
          echo "================================"

          "$AAPT2" dump resources "$APK" > /tmp/resources.txt

          if grep -q "mipmap.*ic_launcher" /tmp/resources.txt; then
            echo "FINAL ICON RESOURCE: FOUND"
            grep -E "mipmap.*ic_launcher" /tmp/resources.txt | head -30
          else
            echo "ERROR: ic_launcher resource was not found"
            exit 1
          fi

          echo "================================"
          echo "APK FILES"
          echo "================================"

          unzip -l "$APK" | grep -E \
            "ic_launcher|mipmap" | head -50 || true

          echo "================================"
          echo "FINAL ICON VERIFICATION: SUCCESS"
          echo "================================"

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: ObaCamera-FINAL-ICON
          path: /tmp/obacamera/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
