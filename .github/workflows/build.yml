name: Build ObaCamera APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Create project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/obacamera

          curl -fsSL \
            "https://raw.githubusercontent.com/tsumotaka19/ObaCamera/781a8a3/.github/workflows/build.yml" \
            -o /tmp/source.yml

          python3 - <<'PY'
          import re
          import base64
          from pathlib import Path

          source = Path("/tmp/source.yml").read_text()

          match = re.search(
              r"echo '([A-Za-z0-9+/=\s]+)'\s*\|\s*base64\s+-d",
              source,
              re.DOTALL
          )

          if not match:
              raise RuntimeError("Embedded project ZIP was not found")

          data = base64.b64decode(
              re.sub(r"\s+", "", match.group(1))
          )

          if not data.startswith(b"PK"):
              raise RuntimeError("Decoded project is not a ZIP")

          Path("/tmp/obacamera/project.zip").write_bytes(data)
          PY

          cd /tmp/obacamera
          unzip -q project.zip

          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

          echo "=== PROJECT CREATED ==="


      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      - name: Set up Android SDK
        uses: android-actions/setup-android@v4


      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "=== ANDROID SDK READY ==="


      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'


      - name: Build APK
        working-directory: /tmp/obacamera
        shell: bash
        run: |
          set -euo pipefail

          echo "=== WRITE BUILD CONFIG ==="

          cat > settings.gradle <<'SETTINGS_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  org.gradle.api.initialization.resolve.RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "ObaCamera"
          include(":app")
          SETTINGS_EOF

          cat > build.gradle <<'ROOT_EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          ROOT_EOF

          cat > app/build.gradle <<'APP_EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.obacamera'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.example.obacamera'
                  minSdk 26
                  targetSdk 35
                  versionCode 2
                  versionName '1.1'
              }
          }

          dependencies {
              def camerax_version = "1.5.3"

              implementation "androidx.camera:camera-core:${camerax_version}"
              implementation "androidx.camera:camera-camera2:${camerax_version}"
              implementation "androidx.camera:camera-lifecycle:${camerax_version}"
              implementation "androidx.camera:camera-view:${camerax_version}"
              implementation "androidx.activity:activity:1.10.1"
          }
          APP_EOF

          echo "=== WRITE MAIN ACTIVITY ==="

          python3 - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          data = gzip.decompress(
              base64.b64decode(
                  ""
              )
          )

          path = Path(
              "app/src/main/java/com/example/obacamera/MainActivity.java"
          )

          path.write_bytes(data)

          if b"0.60f" not in data:
              raise RuntimeError("60% shutter button setting missing")

          if b"0.7f" not in data:
              raise RuntimeError("Shutter volume setting missing")

          if b"R.raw.shutter" not in data:
              raise RuntimeError("Shutter sound resource missing")

          print("MAIN ACTIVITY: OK")
          PY


          echo "=== GENERATE SHUTTER SOUND ==="

          mkdir -p app/src/main/res/raw

          python3 - <<'PY'
          import math
          import random
          import struct
          import wave
          from pathlib import Path

          sr = 16000
          duration = 0.085
          count = int(sr * duration)
          rng = random.Random(7319)

          lp1 = 0.0
          lp2 = 0.0
          samples = []

          events = [
              (0.000, 0.72, 0.006),
              (0.030, 0.58, 0.010),
              (0.064, 0.48, 0.011),
          ]

          for i in range(count):
              t = i / sr
              value = 0.0

              for onset, amp, tau in events:
                  u = t - onset

                  if u < 0.0:
                      continue

                  env = math.exp(-u / tau)
                  env *= min(1.0, u / 0.0006)

                  r = rng.uniform(-1.0, 1.0)
                  lp1 += 0.18 * (r - lp1)
                  hp = r - lp1

                  r2 = rng.uniform(-1.0, 1.0)
                  lp2 += 0.055 * (r2 - lp2)

                  texture = (
                      0.62 * hp
                      + 0.20 * lp2
                      + 0.10 * math.sin(
                          2.0 * math.pi * 1850.0 * u
                      )
                      + 0.05 * math.sin(
                          2.0 * math.pi * 3100.0 * u
                      )
                  )

                  value += amp * texture * env

              if t >= 0.017:
                  u = t - 0.017

                  value += (
                      0.055
                      * rng.uniform(-1.0, 1.0)
                      * math.exp(-u / 0.018)
                  )

              samples.append(value)

          peak = max(abs(x) for x in samples) or 1.0

          samples = [
              max(-1.0, min(1.0, x / peak * 0.70))
              for x in samples
          ]

          output = Path("app/src/main/res/raw/shutter.wav")

          with wave.open(str(output), "wb") as wav:
              wav.setnchannels(1)
              wav.setsampwidth(2)
              wav.setframerate(sr)

              for value in samples:
                  wav.writeframes(
                      struct.pack("<h", int(value * 32767))
                  )

          with wave.open(str(output), "rb") as wav:
              if wav.getframerate() != 16000:
                  raise RuntimeError("Bad sample rate")

              if wav.getnchannels() != 1:
                  raise RuntimeError("Bad channel count")

              if wav.getsampwidth() != 2:
                  raise RuntimeError("Bad sample width")

          print("SHUTTER WAV: OK")
          print("BYTES:", output.stat().st_size)
          print("DURATION:", duration)
          PY


          echo "=== INSTALL ICON ==="

          RES="app/src/main/res"
          MANIFEST="app/src/main/AndroidManifest.xml"

          rm -rf \
            "$RES/mipmap" \
            "$RES/mipmap-mdpi" \
            "$RES/mipmap-hdpi" \
            "$RES/mipmap-xhdpi" \
            "$RES/mipmap-xxhdpi" \
            "$RES/mipmap-xxxhdpi" \
            "$RES/mipmap-anydpi" \
            "$RES/mipmap-anydpi-v26" \
            "$RES/mipmap-nodpi"

          mkdir -p "$RES/mipmap-nodpi"

          curl -fsSL \
            "https://raw.githubusercontent.com/tsumotaka19/ObaCamera/main/icon.png?run=${GITHUB_RUN_ID}" \
            -o "$RES/mipmap-nodpi/ic_launcher.png"

          test -s "$RES/mipmap-nodpi/ic_launcher.png"

          python3 - <<'PY'
          from pathlib import Path
          import re

          icon = Path(
              "app/src/main/res/mipmap-nodpi/ic_launcher.png"
          )

          if not icon.read_bytes().startswith(
              b"\x89PNG\r\n\x1a\n"
          ):
              raise RuntimeError("Final icon is not PNG")

          manifest = Path(
              "app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text()

          text = re.sub(
              r'\s+android:icon\s*=\s*"[^"]*"',
              '',
              text
          )

          text = re.sub(
              r'\s+android:roundIcon\s*=\s*"[^"]*"',
              '',
              text
          )

          text = text.replace(
              "<application",
              '<application android:icon="@mipmap/ic_launcher" '
              'android:roundIcon="@mipmap/ic_launcher"',
              1
          )

          manifest.write_text(text)

          print("ICON: OK")
          print("MANIFEST: OK")
          PY


          echo "=== BUILD APK START ==="

          java -version
          gradle --version

          gradle clean assembleDebug

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          echo "=== APK BUILD SUCCESS ==="

          ls -lh "$APK"


      - name: Verify APK
        working-directory: /tmp/obacamera
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAPT2="$ANDROID_HOME/build-tools/35.0.0/aapt2"

          test -s "$APK"

          echo "=== APK BADGING ==="

          "$AAPT2" dump badging "$APK"

          echo "=== RESOURCE CHECK ==="

          "$AAPT2" dump resources "$APK" | grep -E \
            "shutter|ic_launcher" | head -50 || true

          echo "=== VERIFY APK SUCCESS ==="


      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: ObaCamera-FINAL-ICON-CAMERAX
          path: /tmp/obacamera/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error


      - name: Build completed
        shell: bash
        run: |
          set -euo pipefail

          test -s \
            /tmp/obacamera/app/build/outputs/apk/debug/app-debug.apk

          echo "=== OBA CAMERA APK BUILD COMPLETE ==="
