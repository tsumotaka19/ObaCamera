name: Build ObaCamera APK - Icon

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project from existing workflow
        run: |
          mkdir -p /tmp/obacamera

          curl -fsSL "https://raw.githubusercontent.com/tsumotaka19/ObaCamera/main/.github/workflows/build.yml" \
            -o /tmp/build.yml

          sed -n "s/.*echo '\([^']*\)' | base64 -d.*/\1/p" /tmp/build.yml \
            | base64 -d > /tmp/obacamera/project.zip

          unzip -q /tmp/obacamera/project.zip -d /tmp/obacamera

      - name: Install icon
        run: |
          mkdir -p /tmp/obacamera/app/src/main/res/drawable

          curl -fsSL \
            "https://raw.githubusercontent.com/tsumotaka19/ObaCamera/main/icon.png" \
            -o /tmp/obacamera/app/src/main/res/drawable/icon.png

          test -s /tmp/obacamera/app/src/main/res/drawable/icon.png

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("/tmp/obacamera/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          # 既存の icon / roundIcon を削除
          s = re.sub(r'\s+android:icon="[^"]*"', '', s)
          s = re.sub(r'\s+android:roundIcon="[^"]*"', '', s)

          # application に確実に設定
          s = s.replace(
              '<application',
              '<application android:icon="@drawable/icon" android:roundIcon="@drawable/icon"',
              1
          )

          p.write_text(s)

          print("=== AndroidManifest.xml ===")
          print(s)
          PY

      - name: Verify icon
        run: |
          echo "=== Icon file ==="
          ls -lh /tmp/obacamera/app/src/main/res/drawable/icon.png

          echo "=== Manifest icon ==="
          grep -o 'android:icon="[^"]*"' \
            /tmp/obacamera/app/src/main/AndroidManifest.xml

          echo "=== Manifest roundIcon ==="
          grep -o 'android:roundIcon="[^"]*"' \
            /tmp/obacamera/app/src/main/AndroidManifest.xml

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build APK
        working-directory: /tmp/obacamera
        run: |
          gradle assembleDebug

      - name: Verify APK
        run: |
          test -s /tmp/obacamera/app/build/outputs/apk/debug/app-debug.apk
          echo "APK created successfully"
          ls -lh /tmp/obacamera/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ObaCamera-Icon
          path: /tmp/obacamera/app/build/outputs/apk/debug/app-debug.apk
