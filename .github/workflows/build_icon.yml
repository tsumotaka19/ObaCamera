name: Build ObaCamera APK - FINAL

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create project
        shell: bash
        run: |
          set -e

          mkdir -p /tmp/obacamera

          curl -fsSL \
            "https://raw.githubusercontent.com/tsumotaka19/ObaCamera/main/.github/workflows/build.yml" \
            -o /tmp/build.yml

          sed -n "s/.*echo '\([^']*\)' | base64 -d.*/\1/p" /tmp/build.yml \
            | base64 -d > /tmp/obacamera/project.zip

          unzip -q /tmp/obacamera/project.zip -d /tmp/obacamera

      - name: Install launcher icon
        shell: bash
        run: |
          set -e

          APP="/tmp/obacamera/app"
          RES="$APP/src/main/res"

          curl -fsSL \
            "https://raw.githubusercontent.com/tsumotaka19/ObaCamera/main/icon.png" \
            -o /tmp/icon.png

          test -s /tmp/icon.png

          rm -rf \
            "$RES/drawable/icon.png" \
            "$RES/mipmap-mdpi" \
            "$RES/mipmap-hdpi" \
            "$RES/mipmap-xhdpi" \
            "$RES/mipmap-xxhdpi" \
            "$RES/mipmap-xxxhdpi"

          mkdir -p "$RES/mipmap-mdpi"
          mkdir -p "$RES/mipmap-hdpi"
          mkdir -p "$RES/mipmap-xhdpi"
          mkdir -p "$RES/mipmap-xxhdpi"
          mkdir -p "$RES/mipmap-xxxhdpi"

          cp /tmp/icon.png "$RES/mipmap-mdpi/ic_launcher.png"
          cp /tmp/icon.png "$RES/mipmap-hdpi/ic_launcher.png"
          cp /tmp/icon.png "$RES/mipmap-xhdpi/ic_launcher.png"
          cp /tmp/icon.png "$RES/mipmap-xxhdpi/ic_launcher.png"
          cp /tmp/icon.png "$RES/mipmap-xxxhdpi/ic_launcher.png"

          cp /tmp/icon.png "$RES/mipmap-mdpi/ic_launcher_round.png"
          cp /tmp/icon.png "$RES/mipmap-hdpi/ic_launcher_round.png"
          cp /tmp/icon.png "$RES/mipmap-xhdpi/ic_launcher_round.png"
          cp /tmp/icon.png "$RES/mipmap-xxhdpi/ic_launcher_round.png"
          cp /tmp/icon.png "$RES/mipmap-xxxhdpi/ic_launcher_round.png"

          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path(
              "/tmp/obacamera/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text()

          text = re.sub(
              r'\s+android:icon="[^"]*"',
              '',
              text
          )

          text = re.sub(
              r'\s+android:roundIcon="[^"]*"',
              '',
              text
          )

          text = text.replace(
              "<application",
              '<application android:icon="@mipmap/ic_launcher" '
              'android:roundIcon="@mipmap/ic_launcher_round"',
              1
          )

          manifest.write_text(text)
          PY

          echo "=== Manifest ==="
          grep -o 'android:icon="[^"]*"' \
            "$APP/src/main/AndroidManifest.xml"

          grep -o 'android:roundIcon="[^"]*"' \
            "$APP/src/main/AndroidManifest.xml"

          echo "=== Source icon hash ==="
          sha256sum /tmp/icon.png

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build APK
        working-directory: /tmp/obacamera
        run: |
          gradle assembleDebug

      - name: Verify APK icon
        shell: bash
        run: |
          set -e

          APK="/tmp/obacamera/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          echo "=== Android application icon ==="

          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging "$APK" \
            | grep "application-icon"

          echo "=== Icon files inside APK ==="

          unzip -l "$APK" \
            | grep -E "mipmap-.*/ic_launcher(_round)?\.png"

          echo "=== Extract icon from APK ==="

          ICON_PATH=$(unzip -Z1 "$APK" \
            | grep -E 'mipmap-xxxhdpi.*/ic_launcher\.png$' \
            | head -n 1)

          test -n "$ICON_PATH"

          unzip -p "$APK" "$ICON_PATH" > /tmp/apk_icon.png

          echo "=== Hash comparison ==="

          sha256sum /tmp/icon.png
          sha256sum /tmp/apk_icon.png

          cmp /tmp/icon.png /tmp/apk_icon.png

          echo ""
          echo "================================"
          echo "ICON VERIFICATION: SUCCESS"
          echo "APK ICON MATCHES SOURCE ICON"
          echo "================================"

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: ObaCamera-FINAL-ICON
          path: /tmp/obacamera/app/build/outputs/apk/debug/app-debug.apk
